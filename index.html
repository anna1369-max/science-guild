           導致所有 Modal 視窗（獎懲、招募、商店…）都被錨定在這個較小的容器內而不是整個瀏覽器視窗，

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // --- ★ 音效控制系統 (Web Audio API) ---
        let audioCtx = null;
        const playAudio = (type) => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if (type === 'attack') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'damage') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1000, now);
                    osc.frequency.exponentialRampToValueAtTime(2000, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'penalty') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                } else if (type === 'win') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch(e) { console.error('音效播放失敗', e); }
        };

        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }

                hair: hair, eyes: 'variant01', eyebrows: 'variant01', mouth: 'happy01',

            const members = allStudents.filter(s => s.groupId === groupId);

            const hasRanger = members.some(s => s.job === '遊俠');
            const hasAssassin = members.some(s => s.job === '刺客');
            const hasCleric = members.some(s => s.job === '牧師');

            let expGoldMult = 1, dmgRed = 0, hpBonus = 0, dodgeChance = 0, healAmount = 0, tags = [];

            if (hasWarrior) { dmgRed += 2; tags.push('🛡️防禦(傷-2)'); }
            if (hasMage) { expGoldMult += 0.2; tags.push('⚔️攻擊(益+20%)'); }

            if (hasCleric) { healAmount += 2; tags.push('✨治癒(戰後+2HP)'); }

            const active = hasWarrior || hasMage || hasRanger || hasAssassin || hasCleric;
            const uniqueCount = [hasWarrior, hasMage, hasRanger, hasAssassin, hasCleric].filter(Boolean).length;
            
            let name = '小隊互補';
            if (uniqueCount === 2) { name = '雙星陣型'; }
            if (uniqueCount === 3) { name = '鐵三角陣型'; dmgRed += 1; expGoldMult += 0.1; hpBonus += 5; }
            if (uniqueCount === 4) { name = '四象結界'; dmgRed += 2; expGoldMult += 0.2; hpBonus += 10; }
            if (uniqueCount === 5) { name = '五星連珠'; dmgRed += 3; expGoldMult += 0.3; hpBonus += 20; dodgeChance += 0.1; healAmount += 2; }

            let descArr = [];
            if (dmgRed > 0) descArr.push(`受傷-${dmgRed}`);
            if (expGoldMult > 1) descArr.push(`收益+${Math.round((expGoldMult-1)*100)}%`);
            if (hpBonus > 0) descArr.push(`血量+${hpBonus}`);

            if (healAmount > 0) descArr.push(`恢復+${healAmount}`);

        const VFXOverlay = ({ type, level = 1 }) => {

                        <div className={`absolute bottom-4 right-1/3 w-2.5 h-2.5 rounded-full anim-float-up opacity-50 ${bgColor}`} style={{animationIterationCount: 'infinite', animationDuration: '3s', animationDelay: '0.5s'}}></div>

        const Dashboard = ({ classId, groups, students, logs }) => {

        const Roster = ({ classId, branchName, groups, students, getGroup, onOpenShop, onAddGroup, onAddStudent, ruleItems, onAddRuleItem, onDeleteRuleItem, onApplyRule, onApplyTeamRule }) => {

            // ★ 新增：匯出全班個人數據表 (CSV，可用 Excel 開啟)
            const handleExportCSV = () => {
                const header = ['姓名','所屬小隊','職業','等級','EXP','下一級所需EXP','金幣','HP','MaxHP'];
                const rows = branchStudents.map(s => {
                    const synergy = getGroupSynergy(s.groupId, students);

                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 150; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                                                <div className="flex gap-2">
                                                    <textarea rows="2" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder="例如：獅鷲小隊, 獨角獸小隊..." className="flex-1 p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none custom-scrollbar" />
                                                    <button onClick={() => { if(newGroupName.trim()){ onAddGroup(newGroupName, manageClassId); setNewGroupName(''); } }} className="px-5 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded transition shrink-0">成立</button>
                                                </div>
                                            </div>
                                            <div className="border-t border-gray-700 pt-4 space-y-2">
                                                {manageGroups.map(g => (
                                                    <div key={g.id} className="flex items-center justify-between bg-guild-dark p-3 rounded border border-gray-700">
                                                        <div>
                                                            <span className="font-bold text-guild-paper">{g.name}</span>
                                                            <span className="text-xs text-gray-500 ml-2">成員 {manageStudents.filter(s => s.groupId === g.id).length} 人</span>
                                                        </div>
                                                        <div className="flex items-center gap-1 shrink-0">
                                                            <button onClick={() => setReorderGroupId(g.id)} className="text-blue-400 hover:text-blue-300 transition px-2" title="重新編排小隊成員"><i className="fa-solid fa-users-gear"></i></button>
                                                            <button onClick={() => setConfirmModal({type: 'deleteGroup', groupId: g.id, groupName: g.name})} className="text-red-500 hover:text-red-400 transition px-2"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </div>
                                                ))}
                                                {manageGroups.length === 0 && <div className="text-gray-500 text-sm text-center py-6">本班級尚未建立任何小隊，請在上方新增。</div>}
                                            </div>
                                        </div>
                                    )}
                                    {manageSubTab === 'student' && (
                                        <div className="space-y-2 animate-fade-in">
                                            {manageStudents.map(s => (
                                                <div key={s.id} className="flex items-center justify-between bg-guild-dark p-3 rounded border border-gray-700">
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <AvatarDisplay student={s} size="w-9 h-9" showJob={false} />
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-guild-paper truncate">{s.name} <span className="text-xs text-gray-500 font-normal">Lv.{s.level}</span></div>
                                                            <div className="text-xs text-gray-500 truncate">{getGroupNameLocal(s.groupId)}</div>
                                                        </div>
                                                    </div>
                                                    <button onClick={() => setConfirmModal({type: 'deleteStudent', studentId: s.id, studentName: s.name})} className="text-red-500 hover:text-red-400 transition px-2 shrink-0"><i className="fa-solid fa-trash"></i></button>
                                                </div>
                                            ))}
                                            {manageStudents.length === 0 && <div className="text-gray-500 text-sm text-center py-6">本班級尚未有任何冒險者。</div>}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ★ 重新編排特定小隊成員 Modal */}
                    {reorderGroupId && (() => {
                        const reorderGroup = manageGroups.find(g => g.id === reorderGroupId);
                        if (!reorderGroup) return null;
                        return (
                            <div className="fixed inset-0 bg-black/80 flex p-4 z-[95] overflow-y-auto">
                                <div className="panel p-0 max-w-lg w-full flex flex-col relative border-blue-500 overflow-hidden max-h-[85vh] m-auto">
                                    <button onClick={() => setReorderGroupId(null)} className="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl transition hover:rotate-90 z-10"><i className="fa-solid fa-xmark"></i></button>
                                    <div className="p-6 pb-4 bg-guild-dark border-b border-blue-500/30">
                                        <h3 className="text-2xl font-bold text-blue-400 mb-1"><i className="fa-solid fa-users-gear mr-2"></i>重新編排【{reorderGroup.name}】成員</h3>
                                        <p className="text-xs text-gray-500">勾選即可將該冒險者編入此小隊；取消勾選則將其移出（改為無小隊）。若冒險者原屬其他小隊，勾選後會直接改隸屬本小隊。</p>
                                    </div>
                                    <div className="p-6 bg-guild-panel overflow-y-auto custom-scrollbar space-y-2">
                                        {manageStudents.map(s => {
                                            const isMember = s.groupId === reorderGroupId;
                                            return (
                                                <label key={s.id} className={`flex items-center justify-between p-3 rounded border cursor-pointer transition ${isMember ? 'bg-blue-900/30 border-blue-500' : 'bg-guild-dark border-gray-700 hover:border-gray-500'}`}>
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <AvatarDisplay student={s} size="w-9 h-9" showJob={false} />
                                                        <div className="min-w-0">
                                                            <div className="font-bold text-guild-paper truncate">{s.name} <span className="text-xs text-gray-500 font-normal">Lv.{s.level}</span></div>
                                                            <div className="text-xs text-gray-500 truncate">目前：{getGroupNameLocal(s.groupId)}</div>
                                                        </div>
                                                    </div>
                                                    <input type="checkbox" checked={isMember} onChange={(e) => onMoveStudent(s.id, e.target.checked ? reorderGroupId : null)} className="w-5 h-5 accent-blue-500 shrink-0 ml-3" />
                                                </label>
                                            );
                                        })}
                                        {manageStudents.length === 0 && <div className="text-gray-500 text-sm text-center py-6">本班級尚未有任何冒險者。</div>}
                                    </div>
                                    <div className="p-4 border-t border-blue-900/50 bg-guild-dark text-right">
                                        <button onClick={() => setReorderGroupId(null)} className="px-6 py-2 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded transition">完成</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            )
        };

        const QuestBoard = ({ classId, students, groups, squadBosses, guildBoss, onResult, onSpawnBoss, onBossAttack }) => {
            const [tab, setTab] = useState('normal'); 
            const [aiTopic, setAiTopic] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiData, setAiData] = useState(null); 
            const [aiSelectedOpt, setAiSelectedOpt] = useState(null);
            const [aiResultText, setAiResultText] = useState(null);
            
            const [selectedStudent, setSelectedStudent] = useState('');
            const [selectedGroupId, setSelectedGroupId] = useState('');
            
            const [isSpinningStudent, setIsSpinningStudent] = useState(false);
            const [reelStudents, setReelStudents] = useState([]);
            const [isSpinningMonster, setIsSpinningMonster] = useState(false);
            const [reelMonsters, setReelMonsters] = useState([]);
            const [drawnMonster, setDrawnMonster] = useState(null);
            
            const [combatAnim, setCombatAnim] = useState({ student: '', monster: '' });
            const [vfx, setVfx] = useState({ student: null, monster: null, studentLevel: 1 });
            const [floatingTexts, setFloatingTexts] = useState([]);
            const [isFighting, setIsFighting] = useState(false);
            
            const TOTAL_ITEMS = 20;
            const SPIN_DURATION = 1500;

            const activeStudents = students.filter(s => s.hp > 0 && s.classId === classId);
            const branchGroups = groups.filter(g => g.classId === classId);
            
            let availableStudents = activeStudents;
            if (tab === 'squad' && selectedGroupId) {
                availableStudents = activeStudents.filter(s => s.groupId === parseInt(selectedGroupId));
            }

            const activeBoss = tab === 'squad' ? squadBosses[selectedGroupId] : tab === 'guild' ? guildBoss : drawnMonster;

            const addFloatingText = (text, type, target) => {
                const id = Date.now() + Math.random();
                setFloatingTexts(prev => [...prev, { id, text, type, target }]);
                setTimeout(() => setFloatingTexts(prev => prev.filter(ft => ft.id !== id)), 1200);
            };

            const resetBoard = () => {
                setDrawnMonster(null); setSelectedStudent(''); setReelMonsters([]); setReelStudents([]); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 }); setIsFighting(false); setAiData(null); setAiSelectedOpt(null); setAiResultText(null);
            };

            const spawnBoss = () => {
                setIsSpinningMonster(true);
                setCombatAnim({ student: '', monster: '' });
                const bossList = BOSS_MONSTERS.filter(b => b.type === tab);
                let newMReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newMReel.push(bossList[Math.floor(Math.random() * bossList.length)]);
                setReelMonsters(newMReel);
                
                setTimeout(() => { 
                    setIsSpinningMonster(false); 
                    const selectedBoss = { ...newMReel[TOTAL_ITEMS - 1], currentHp: newMReel[TOTAL_ITEMS - 1].maxHp, contributions: {} };
                    onSpawnBoss(tab, tab === 'squad' ? parseInt(selectedGroupId) : null, selectedBoss);
                }, 3000);
            };

            const handleGenerateAI = async () => {
                if (!aiTopic.trim()) return;
                setIsGenerating(true); setAiData(null); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setAiResultText(null);
                const prompt = `請根據自然科學或相關學科主題「${aiTopic}」出一個單選題，並設計一隻與此主題相關的奇幻魔物。魔物的 icon 請使用 FontAwesome 格式 (例如 fa-ghost, fa-bug)，color 請使用 Tailwind 文字顏色 (例如 text-purple-500)。`;
                
                try {
                    const payload = { 
                        contents: [{ parts: [{ text: prompt }] }], 
                        generationConfig: { 
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    question: { type: "STRING" },
                                    options: { type: "ARRAY", items: { type: "STRING" } },
                                    answerIndex: { type: "INTEGER" },
                                    explanation: { type: "STRING" },
                                    monster: {
                                        type: "OBJECT",
                                        properties: {
                                            id: { type: "STRING" },
                                            name: { type: "STRING" },
                                            diff: { type: "STRING" },
                                            exp: { type: "INTEGER" },
                                            gold: { type: "INTEGER" },
                                            dmg: { type: "INTEGER" },
                                            icon: { type: "STRING" },
                                            color: { type: "STRING" }
                                        },
                                        required: ["id", "name", "diff", "exp", "gold", "dmg", "icon", "color"]
                                    }
                                },
                                required: ["question", "options", "answerIndex", "explanation", "monster"]
                            }
                        } 
                    };
                    const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    
                    const text = res.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("API 未回傳內容");
                    
                    const data = JSON.parse(text);
                    setAiData(data); setDrawnMonster(data.monster);
                } catch (error) {
                    console.error(error); 
                    setAiData({ question: "⚠️ 魔法陣受到干擾，召喚失敗了！", options: ["了解"], answerIndex: -1, explanation: "魔法卷軸吟唱失敗，可能是因為剛才的魔力波動太大（網路不穩），請重新輸入主題再次召喚！", monster: null });
                } finally { setIsGenerating(false); }
            };

            const spinStudentOnly = () => {
                if (availableStudents.length === 0) return alert('小隊中沒有存活的冒險者可以出擊！');
                setIsSpinningStudent(true);
                let newSReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newSReel.push(availableStudents[Math.floor(Math.random() * availableStudents.length)]);
                setReelStudents(newSReel);
                setTimeout(() => {
                    setIsSpinningStudent(false);
                    setSelectedStudent(newSReel[TOTAL_ITEMS-1].id.toString());
                }, SPIN_DURATION);
            };

            const handleDrawStudentAndSpin = () => {
                if (activeStudents.length === 0) return alert('目前沒有可指派的冒險者！');
                setIsSpinningStudent(true); setIsSpinningMonster(true); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 });
                let newSReel = []; let newMReel = [];
                const currentSelectedObj = activeStudents.find(s => s.id === parseInt(selectedStudent)) || activeStudents[0];
                for(let i=0; i<TOTAL_ITEMS; i++) {
                    if(i === 0) newSReel.push(currentSelectedObj); else newSReel.push(activeStudents[Math.floor(Math.random() * activeStudents.length)]);
                    newMReel.push(MONSTERS[Math.floor(Math.random() * MONSTERS.length)]);
                }
                setReelStudents(newSReel); setReelMonsters(newMReel);
                setTimeout(() => { setIsSpinningStudent(false); setSelectedStudent(newSReel[TOTAL_ITEMS - 1].id.toString()); }, SPIN_DURATION);
                setTimeout(() => { setIsSpinningMonster(false); setDrawnMonster(newMReel[TOTAL_ITEMS - 1]); }, 3000);
            };

            const startSpin = () => {
                if (!selectedStudent) return alert('請先選擇接受任務的冒險者！');
                setIsSpinningMonster(true); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 });
                let newMReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newMReel.push(MONSTERS[Math.floor(Math.random() * MONSTERS.length)]);
                setReelMonsters(newMReel);
                setTimeout(() => { setIsSpinningMonster(false); setDrawnMonster(newMReel[TOTAL_ITEMS - 1]); }, 3000);
            };

            const executeFight = (isCorrect) => {
                if (!selectedStudent || !activeBoss || isFighting) return;
                setIsFighting(true);
                const student = activeStudents.find(s => s.id === parseInt(selectedStudent));
                const jobType = student.job === '戰士' ? 'warrior' : student.job === '法師' ? 'mage' : student.job === '遊俠' ? 'ranger' : student.job === '刺客' ? 'assassin' : student.job === '牧師' ? 'cleric' : 'novice';
                const synergy = getGroupSynergy(student.groupId, students);
                
                const weaponStats = student.equipment?.stats || {};
                const weaponAtk = weaponStats.atkBase || 0;
                const weaponExp = weaponStats.expMult || 0;
                const weaponGold = weaponStats.goldMult || 0;
                const weaponDodge = weaponStats.dodgeBonus || 0;
                const weaponDef = weaponStats.defBonus || 0;
                const weaponHeal = weaponStats.healBonus || 0;

                const isBossBattle = tab === 'squad' || tab === 'guild';

                let finalExp = isBossBattle ? 0 : activeBoss.exp;
                let finalGold = isBossBattle ? 0 : activeBoss.gold;
                let finalDmg = activeBoss.dmg;
                let damageDealtToBoss = 0;
                let isDodged = false;
                let healAmt = (synergy.active ? synergy.healAmount : 0) + (student.job === '牧師' ? 5 : 0) + weaponHeal;

                if (isCorrect) {
                    if (isBossBattle) {
                        let baseAtk = 20 + (student.level * 10) + weaponAtk;
                        let jobMult = student.job === '法師' ? 1.2 : (student.job === '遊俠' ? 1.03 : 1.0);
                        let synMult = (synergy.active && synergy.expGoldMult > 1) ? synergy.expGoldMult : 1.0;
                        damageDealtToBoss = Math.floor(baseAtk * jobMult * synMult * (0.9 + Math.random() * 0.2));
                    } else {
                        let expMult = 1 + weaponExp;
                        let goldMult = 1 + weaponGold;
                        if (student.job === '法師') expMult += 0.1;
                        if (student.job === '遊俠') { expMult += 0.03; goldMult += 0.03; }
                        if (synergy.active && synergy.expGoldMult > 1) {
                            expMult *= synergy.expGoldMult;
                            goldMult *= synergy.expGoldMult;
                        }
                        finalExp = Math.floor(finalExp * expMult);
                        finalGold = Math.floor(finalGold * goldMult);
                    }

                    setCombatAnim({ student: 'anim-attack-right', monster: '' });
                    setTimeout(() => {
                        playAudio('attack'); 
                        setVfx({ student: null, monster: jobType, studentLevel: student.level }); 
                        setCombatAnim({ student: '', monster: 'anim-shake-red' }); 
                        addFloatingText(isBossBattle ? `⚔️ ${damageDealtToBoss} 傷!` : '⚔️ 爆擊!', 'damage', 'monster');
                        
                        setTimeout(() => {
                            setVfx({ student: null, monster: null, studentLevel: 1 }); 
                            setCombatAnim({ student: '', monster: 'anim-fade-out' });
                            playAudio('win'); 
                            
                            if (!isBossBattle) {
                                addFloatingText(`+${finalExp} EXP`, 'exp', 'student');
                                setTimeout(() => {
                                    playAudio('coin'); 
                                    addFloatingText(`+${finalGold} G`, 'gold', 'student');
                                }, 300);
                            }
                            if (healAmt > 0) setTimeout(() => addFloatingText(`+${healAmt} HP`, 'heal', 'student'), 600);

                            setTimeout(() => { 
                                if (isBossBattle) {
                                    onBossAttack(student.id, tab, selectedGroupId, damageDealtToBoss, 0, 0, false, activeBoss.id);
                                } else {
                                    onResult(parseInt(selectedStudent), activeBoss, true, { finalExp, finalGold, finalDmg: 0, healAmt, isDodged: false }); 
                                    resetBoard(); 
                                }
                                setIsFighting(false);
                                if(isBossBattle) {
                                    setCombatAnim({ student: '', monster: '' });
                                    setSelectedStudent('');
                                }
                            }, 1000);
                        }, 700);
                    }, 300);
                } else {
                    let myDodge = (student.job === '刺客' ? 0.20 : 0) + weaponDodge;
                    if (Math.random() < myDodge) isDodged = true;
                    if (!isDodged && synergy.active && synergy.dodgeChance > 0 && Math.random() < synergy.dodgeChance) isDodged = true;

                    if (isDodged) finalDmg = 0;
                    else {
                        let myDef = (student.job === '戰士' ? 5 : 0) + weaponDef;
                        if (synergy.active && synergy.dmgRed > 0) myDef += synergy.dmgRed;
                        finalDmg = Math.max(1, finalDmg - myDef);
                    }

                    setCombatAnim({ student: '', monster: 'anim-attack-left' });
                    setTimeout(() => {
                        playAudio('attack'); 
                        setVfx({ student: 'monster', monster: null, studentLevel: 1 });
                        if (!isDodged) {
                            setCombatAnim({ student: 'anim-shake-red', monster: '' });
                            playAudio('damage'); 
                        } else {
                            playAudio('win'); 
                        }
                        
                        if (isDodged) addFloatingText('💨 閃避!', 'heal', 'student');
                        else addFloatingText(`-${finalDmg} HP`, 'damage', 'student');
                        
                        if (healAmt > 0) setTimeout(() => addFloatingText(`+${healAmt} HP`, 'heal', 'student'), 600);

                        setTimeout(() => { 
                            setVfx({ student: null, monster: null, studentLevel: 1 }); 
                            if (isBossBattle) {
                                onBossAttack(student.id, tab, selectedGroupId, 0, finalDmg, 0, isDodged, activeBoss.id);
                            } else {
                                onResult(parseInt(selectedStudent), activeBoss, false, { finalExp: 0, finalGold: 0, finalDmg, healAmt, isDodged }); 
                                resetBoard(); 
                            }
                            setIsFighting(false);
                            if(isBossBattle) {
                                setCombatAnim({ student: '', monster: '' });
                                setSelectedStudent('');
                            }
                        }, 1200);
                    }, 300);
                }
            };

            const handleAiAnswer = (index) => {
                if (aiSelectedOpt !== null) return;
                setAiSelectedOpt(index);
                const isCorrect = index === aiData.answerIndex;
                if (isCorrect) setAiResultText("✨ 答對了！魔物被重創！"); else setAiResultText("❌ 答錯了！遭到了魔物的反擊！");
                setTimeout(() => { executeFight(isCorrect); }, 1500);
            };

            return (
                <div className="max-w-5xl mx-auto animate-fade-in">
                    <div className="flex justify-between items-end border-b border-guild-gold/30 pb-2 mb-6">
                        <h2 className="text-3xl font-bold text-guild-gold">任務看板</h2>
                        <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                            <button onClick={() => { setTab('normal'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'normal' ? 'bg-guild-gold text-guild-dark' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-slot-machine mr-2"></i>一般遭遇</button>
                            <button onClick={() => { setTab('ai'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'ai' ? 'bg-purple-600 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-scroll mr-2"></i>AI 魔法卷軸</button>
                            <button onClick={() => { setTab('squad'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'squad' ? 'bg-blue-600 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-dungeon mr-2"></i>小隊迷宮戰</button>
                            <button onClick={() => { setTab('guild'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'guild' ? 'bg-red-700 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-globe mr-2"></i>全公會討伐</button>
                        </div>
                    </div>
                    
                    <div className={`panel p-6 md:p-10 text-center relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] ${tab === 'ai' ? 'from-purple-900/40 via-guild-dark to-black' : tab === 'squad' ? 'from-blue-900/30 via-guild-dark to-black' : tab === 'guild' ? 'from-red-900/30 via-guild-dark to-black' : 'from-guild-panel via-guild-dark to-black'}`}>
                        
                        {tab === 'squad' && (
                            <div className="mb-6 max-w-sm mx-auto">
                                <select className="w-full p-3 bg-guild-dark border border-blue-500 rounded text-blue-200 font-bold focus:outline-none shadow-[0_0_15px_rgba(59,130,246,0.3)]" value={selectedGroupId} onChange={e => {setSelectedGroupId(e.target.value); setSelectedStudent('');}}>
                                    <option value="">-- 請先選擇進入迷宮的小隊 --</option>
                                    {branchGroups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                </select>
                            </div>
                        )}

                        <div className="mb-8 max-w-lg mx-auto text-left relative z-10 bg-black/40 p-4 rounded-xl border border-guild-gold/20">
                            <label className="block text-guild-paper mb-2 font-bold text-center"><i className="fa-solid fa-hand-pointer mr-2"></i>指派冒險者</label>
                            <div className="flex gap-2">
                                <select className="flex-1 p-4 bg-guild-dark border-2 border-guild-gold rounded-lg text-guild-gold font-bold text-lg focus:outline-none shadow-[0_0_15px_rgba(197,159,68,0.3)]" value={selectedStudent} onChange={(e) => setSelectedStudent(e.target.value)} disabled={isSpinningStudent || isSpinningMonster || isFighting || isGenerating || (tab === 'squad' && !selectedGroupId)}>
                                    <option value="">-- 手動點名 --</option>
                                    {availableStudents.map(s => <option key={s.id} value={s.id}>{s.name} (Lv.{s.level} {s.job}) - HP: {s.hp}</option>)}
