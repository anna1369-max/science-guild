                                        {tab === 'squad' || tab === 'guild' ? (
                                            <>攻擊：對魔王造成 <span className="text-blue-400 font-bold">大量傷害</span> &nbsp;&nbsp;|&nbsp;&nbsp; 失敗：受到 <span className="text-red-400 font-bold">{activeBoss.dmg} 點 HP</span> 傷害</>
                                        ) : (
                                            <>擊殺：<span className="text-blue-400 font-bold">{activeBoss.exp} EXP</span> / <span className="text-yellow-400 font-bold">{activeBoss.gold} G</span> &nbsp;&nbsp;|&nbsp;&nbsp; 失敗：扣除 <span className="text-red-400 font-bold">{activeBoss.dmg} 點 HP</span></>
                                        )}
                                    </div>
                                    <div className="flex justify-center gap-6">
                                        <button onClick={() => executeFight(true)} disabled={!selectedStudent} className="px-8 py-4 bg-green-800 hover:bg-green-700 disabled:bg-gray-800 text-white font-bold rounded-lg shadow-lg border border-green-600 disabled:border-gray-600 transition text-xl flex-1 max-w-[220px]"><i className="fa-solid fa-check mr-2"></i> 答對 (攻擊)</button>
                                        <button onClick={() => executeFight(false)} disabled={!selectedStudent} className="px-8 py-4 bg-red-900 hover:bg-red-800 disabled:bg-gray-800 text-white font-bold rounded-lg shadow-lg border border-red-700 disabled:border-gray-600 transition text-xl flex-1 max-w-[220px]"><i className="fa-solid fa-xmark mr-2"></i> 答錯 (受傷)</button>
                                    </div>
                                    {!selectedStudent && <div className="text-red-400 text-sm mt-3 animate-pulse">請先從上方選擇出戰的冒險者！</div>}
                                </div>
                            )}

                            {/* AI 模式考題顯示 */}
                            {tab === 'ai' && aiData && !isFighting && !isSpinningStudent && (
                                <div className="animate-fade-in text-left max-w-2xl mx-auto bg-black/80 p-6 rounded-xl border border-purple-500 shadow-[0_0_30px_rgba(168,85,247,0.3)]">
                                    <div className="text-purple-400 text-sm mb-2"><i className="fa-solid fa-scroll mr-2"></i>來自古代魔法卷軸的考驗</div>
                                    <h3 className="text-xl text-white font-bold mb-6 leading-relaxed">{aiData.question}</h3>
                                    <div className="grid grid-cols-1 gap-3">
                                        {aiData.options.map((opt, idx) => {
                                            let btnClass = "bg-guild-dark text-gray-300 hover:border-purple-400 hover:text-white border-gray-600";
                                            if (aiSelectedOpt !== null) {
                                                if (idx === aiData.answerIndex) btnClass = "bg-green-900/50 text-green-400 border-green-500";
                                                else if (idx === aiSelectedOpt) btnClass = "bg-red-900/50 text-red-400 border-red-500";
                                                else btnClass = "bg-guild-dark text-gray-600 border-gray-800 opacity-50";
                                            }
                                            return <button key={idx} onClick={() => handleAiAnswer(idx)} disabled={aiSelectedOpt !== null} className={`p-4 text-left rounded-lg border transition ${btnClass}`}><span className="font-bold mr-3">{['A', 'B', 'C', 'D'][idx]}.</span> {opt}</button>
                                        })}
                                    </div>
                                    {aiResultText && (
                                        <div className="mt-6 pt-4 border-t border-purple-500/30 animate-fade-in">
                                            <div className={`text-lg font-bold mb-2 ${aiSelectedOpt === aiData.answerIndex ? 'text-green-400' : 'text-red-400'}`}>{aiResultText}</div>
                                            <div className="text-gray-400 text-sm"><span className="text-yellow-500 font-bold">詳解：</span>{aiData.explanation}</div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Shop = ({ buyer, onBuy, onClose }) => {
            if (!buyer) return null;
            
            const groups = JSON.parse(localStorage.getItem('guild_groups') || '[]');
            const students = JSON.parse(localStorage.getItem('guild_students') || '[]');
            const synergy = getGroupSynergy(buyer.groupId, students);
            const effectiveMaxHp = buyer.maxHp + synergy.hpBonus;

            return (
                <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
                    <div className="panel p-6 max-w-6xl w-full max-h-[90vh] flex flex-col relative border-guild-gold shadow-[0_0_30px_rgba(197,159,68,0.3)]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white text-3xl transition hover:rotate-90 z-10"><i className="fa-solid fa-xmark"></i></button>
                        <h2 className="text-3xl font-bold text-guild-gold border-b border-guild-gold/30 pb-3 mb-6"><i className="fa-solid fa-store mr-2"></i>道具與武器商行</h2>
                        <div className="flex flex-col md:flex-row gap-8 overflow-y-auto pr-2 custom-scrollbar">
                            
                            {/* 左側：冒險者屬性面板 */}
                            <div className="md:w-1/3 shrink-0">
                                <div className="bg-guild-dark p-6 rounded-lg border border-guild-gold/30 sticky top-0 shadow-lg flex flex-col items-center">
                                    <AvatarDisplay student={buyer} size="w-32 h-32" />
                                    <div className="text-guild-gold font-bold text-xl mt-4 mb-1">{buyer.name}</div>
                                    <div className="text-sm text-gray-400 mb-4">Lv.{buyer.level} {buyer.job}</div>
                                    <div className="w-full space-y-3 text-sm bg-black/30 p-4 rounded-lg">
                                        <div className="flex justify-between items-center"><span className="text-gray-400">生命:</span> <span><span className="text-red-400">{buyer.hp}</span> / {effectiveMaxHp}</span></div>
                                        <div className="flex justify-between items-center"><span className="text-gray-400">財富:</span> <span className="text-yellow-400 font-bold text-lg">{buyer.gold} G</span></div>
                                        <div className="flex justify-between items-center pt-2 border-t border-gray-700"><span className="text-gray-400">裝備:</span> <span className="text-blue-300 font-bold">{buyer.equipment ? buyer.equipment.name : '無'}</span></div>
                                    </div>
                                </div>
                            </div>

                            {/* 右側：商城列表 */}
                            <div className="md:w-2/3 h-fit">
                                <h3 className="text-lg font-bold text-guild-paper mb-3 flex items-center"><i className="fa-solid fa-flask mr-2 text-blue-400"></i>消耗品與憑證</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                    {SHOP_ITEMS.filter(item => item.type === 'consumable' || item.type === 'passive' || item.type === 'special').map(item => {
                                        const canAfford = buyer.gold >= item.cost;
                                        const isWrongJob = item.job && buyer.job !== item.job;
                                        const disabled = !canAfford || isWrongJob;
                                        
                                        let itemBg = 'bg-guild-dark/50 hover:bg-guild-dark border-transparent hover:border-guild-gold/30';
                                        let titleColor = 'text-guild-paper';
                                        if (item.type === 'special') {
                                            itemBg = 'bg-purple-900/30 border-purple-500/50 hover:bg-purple-900/50';
                                            titleColor = 'text-purple-300';
                                        }

                                        return (
                                            <div key={item.id} className={`panel p-4 flex flex-col transition border relative overflow-hidden ${itemBg}`}>
                                                <div className="flex justify-between items-start mb-2 z-10">
                                                    <h4 className={`font-bold text-lg ${titleColor}`}>{item.name}</h4>
                                                    <span className="text-guild-gold font-bold bg-yellow-900/30 px-2 py-1 rounded text-sm"><i className="fa-solid fa-coins mr-1"></i>{item.cost}</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 flex-grow z-10 leading-relaxed">{item.desc}</p>
                                                {item.job && <div className="text-xs font-bold text-blue-400 mb-3 z-10"><i className="fa-solid fa-circle-exclamation mr-1"></i>限定職業: {item.job}</div>}
                                                <button onClick={() => onBuy(buyer.id, item)} disabled={disabled} className={`mt-auto w-full py-2 rounded font-bold transition flex items-center justify-center gap-2 z-10 ${disabled ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : (item.type === 'special' ? 'bg-purple-600 text-white hover:bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.5)]' : 'bg-guild-gold text-guild-dark hover:bg-yellow-400 hover:scale-[1.02]')}`}>
                                                    {isWrongJob ? <><i className="fa-solid fa-ban"></i> 職業不符</> : !canAfford ? <><i className="fa-solid fa-lock"></i> 金幣不足</> : <><i className="fa-solid fa-cart-shopping"></i> 購買</>}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <h3 className="text-lg font-bold text-blue-400 mb-3 flex items-center"><i className="fa-solid fa-khanda mr-2"></i>職業專屬武器 (裝備可獲得加成)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                                    {SHOP_ITEMS.filter(item => item.type === 'equipment').map(item => {
                                        const canAfford = buyer.gold >= item.cost;
                                        const isWrongJob = item.job && buyer.job !== item.job;
                                        const disabled = !canAfford || isWrongJob;
                                        
                                        // 判斷 T2 武器賦予藍色史詩光芒
                                        let itemBg = 'bg-guild-dark/50 hover:bg-guild-dark border-transparent hover:border-guild-gold/30';
                                        let titleColor = 'text-guild-paper';
                                        if (item.id.includes('w2_')) {
                                            itemBg = 'bg-blue-900/20 border-blue-500/40 hover:bg-blue-900/40 hover:border-blue-400';
                                            titleColor = 'text-blue-300';
                                        }

                                        return (
                                            <div key={item.id} className={`panel p-4 flex flex-col transition border relative overflow-hidden ${itemBg}`}>
                                                <div className="flex justify-between items-start mb-2 z-10">
                                                    <h4 className={`font-bold text-lg ${titleColor}`}>{item.name}</h4>
                                                    <span className="text-guild-gold font-bold bg-yellow-900/30 px-2 py-1 rounded text-sm"><i className="fa-solid fa-coins mr-1"></i>{item.cost}</span>
                                                </div>
                                                <p className="text-xs text-gray-400 mb-4 flex-grow z-10 leading-relaxed">{item.desc}</p>
                                                {item.job && <div className="text-xs font-bold text-blue-400 mb-3 z-10"><i className="fa-solid fa-circle-exclamation mr-1"></i>限定職業: {item.job}</div>}
                                                <button onClick={() => onBuy(buyer.id, item)} disabled={disabled} className={`mt-auto w-full py-2 rounded font-bold transition flex items-center justify-center gap-2 z-10 ${disabled ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : (item.id.includes('w2_') ? 'bg-blue-700 text-white hover:bg-blue-600 shadow-[0_0_10px_rgba(59,130,246,0.5)]' : 'bg-guild-gold text-guild-dark hover:bg-yellow-400 hover:scale-[1.02]')}`}>
                                                    {isWrongJob ? <><i className="fa-solid fa-ban"></i> 職業不符</> : !canAfford ? <><i className="fa-solid fa-lock"></i> 金幣不足</> : <><i className="fa-solid fa-khanda"></i> 裝備</>}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <h3 className="text-lg font-bold text-yellow-500 mb-3 flex items-center"><i className="fa-solid fa-crown mr-2"></i>尊爵頭像外框 (解鎖永久擁有)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {SHOP_ITEMS.filter(item => item.type === 'frame').map(item => {
                                        const canAfford = buyer.gold >= item.cost;
                                        const isOwned = buyer.avatar.unlockedFrames.includes(item.value);
                                        const disabled = !canAfford || isOwned;
                                        return (
                                            <div key={item.id} className="panel p-4 flex flex-col bg-guild-dark border border-yellow-700/50 relative overflow-hidden">
                                                <div className="flex justify-between items-start mb-2 z-10"><h4 className="font-bold text-lg text-yellow-500">{item.name}</h4><span className="text-guild-gold font-bold bg-yellow-900/30 px-2 py-1 rounded text-sm"><i className="fa-solid fa-coins mr-1"></i>{item.cost}</span></div>
                                                <p className="text-xs text-yellow-200/60 mb-4 flex-grow z-10">{item.desc}</p>
                                                <button onClick={() => onBuy(buyer.id, item)} disabled={disabled} className={`mt-auto w-full py-2 rounded font-bold transition flex items-center justify-center gap-2 z-10 ${isOwned ? 'bg-green-900/50 text-green-400 border border-green-600 cursor-not-allowed' : disabled ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-yellow-600 text-white hover:bg-yellow-500 shadow-[0_0_10px_rgba(202,138,4,0.5)]'}`}>
                                                    {isOwned ? <><i className="fa-solid fa-check"></i> 已解鎖</> : !canAfford ? <><i className="fa-solid fa-lock"></i> 金幣不足</> : <><i className="fa-solid fa-unlock"></i> 解鎖外觀</>}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentClassId, setCurrentClassId] = useState(null); 
            const [view, setView] = useState('dashboard'); 
            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [groups, setGroups] = useState([]);
            const [logs, setLogs] = useState([]); 
            const [showJobModal, setShowJobModal] = useState(null); 
            const [shopBuyerId, setShopBuyerId] = useState(null); 
            const [editingAvatarId, setEditingAvatarId] = useState(null);
            
            // ★ 新增：魔王戰資料持久化
            const [squadBosses, setSquadBosses] = useState({});
            const [guildBoss, setGuildBoss] = useState(null);

            useEffect(() => {
                const savedClasses = localStorage.getItem('guild_classes');
                const savedStudents = localStorage.getItem('guild_students');
                const savedGroups = localStorage.getItem('guild_groups');
                const savedLogs = localStorage.getItem('guild_logs');
                const savedSquadBosses = localStorage.getItem('guild_squad_bosses');
                const savedGuildBoss = localStorage.getItem('guild_guild_boss');
                
                if (savedClasses && savedStudents && savedGroups) {
                    setClasses(JSON.parse(savedClasses));
                    let parsedStudents = JSON.parse(savedStudents);
                    parsedStudents = parsedStudents.map(s => {
                        let av = s.avatar || {};
                        return {
                            ...s, 
                            avatar: {
                                seed: av.seed || s.name,
                                skinColor: AVATAR_OPTIONS.skinColor.some(o => o.id === av.skinColor) ? av.skinColor : 'f2d3b1',
                                hairColor: AVATAR_OPTIONS.hairColor.some(o => o.id === av.hairColor) ? av.hairColor : '111111',
                                head: AVATAR_OPTIONS.head.some(o => o.id === av.head) ? av.head : 'variant01', 
                                hair: AVATAR_OPTIONS.hair.some(o => o.id === av.hair) ? av.hair : 'variant01',
                                eyes: AVATAR_OPTIONS.eyes.some(o => o.id === av.eyes) ? av.eyes : 'variant01',
                                eyebrows: AVATAR_OPTIONS.eyebrows.some(o => o.id === av.eyebrows) ? av.eyebrows : 'variant01',
                                mouth: AVATAR_OPTIONS.mouth.some(o => o.id === av.mouth) ? av.mouth : 'happy01',
                                glasses: AVATAR_OPTIONS.glasses.some(o => o.id === av.glasses) ? av.glasses : 'none',
                                freckles: AVATAR_OPTIONS.freckles.some(o => o.id === av.freckles) ? av.freckles : '0',
                                frameClass: av.frameClass || 'border-gray-500',
                                unlockedFrames: av.unlockedFrames || ['border-gray-500'],
                                customImage: av.customImage || null,
                                customImageStatus: av.customImageStatus || 'none'
                            }
                        };
                    });
                    setStudents(parsedStudents);
                    setGroups(JSON.parse(savedGroups));
                    
                    let parsedLogs = JSON.parse(savedLogs) || [];
                    setLogs(parsedLogs.map(l => typeof l === 'string' ? { time: '', msg: l, classId: null } : l));
                    
                    if (savedSquadBosses) setSquadBosses(JSON.parse(savedSquadBosses));
                    if (savedGuildBoss) setGuildBoss(JSON.parse(savedGuildBoss));
                } else {
                    setClasses(INITIAL_CLASSES);
                    setStudents(INITIAL_STUDENTS);
                    setGroups(INITIAL_GROUPS);
                }
            }, []);

            useEffect(() => {
                if (classes.length > 0) {
                    localStorage.setItem('guild_classes', JSON.stringify(classes));
                    localStorage.setItem('guild_students', JSON.stringify(students));
                    localStorage.setItem('guild_groups', JSON.stringify(groups));
                    localStorage.setItem('guild_logs', JSON.stringify(logs));
                    localStorage.setItem('guild_squad_bosses', JSON.stringify(squadBosses));
                    localStorage.setItem('guild_guild_boss', JSON.stringify(guildBoss));
                }
            }, [classes, students, groups, logs, squadBosses, guildBoss]);

            const addLog = (msg, targetClassId = currentClassId) => {
                const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                setLogs(prev => [{time, msg, classId: targetClassId}, ...prev].slice(0, 100));
            };

            const getExpReq = (level) => level * 100;

            const handleSpawnBoss = (type, groupId, bossObj) => {
                if (type === 'squad') {
                    setSquadBosses(prev => ({ ...prev, [groupId]: bossObj }));
                    addLog(`⚠️ 迷宮震動... 【${getGroup(groupId)?.name}】遭遇了迷宮魔王 ${bossObj.name}！`, getClassObj(currentClassId)?.id);
                } else {
                    setGuildBoss(bossObj);
                    addLog(`🚨 空間裂縫開啟！世界首領 ${bossObj.name} 降臨公會大廳！`, null);
                }
            };

            const distributeBossRewards = (bossData, currentStudents, currentGroups) => {
                let updatedStudents = [...currentStudents];
                let updatedGroups = [...currentGroups];
                
                Object.entries(bossData.contributions).forEach(([cIdStr, cDmg]) => {
                    const cId = parseInt(cIdStr);
                    const ratio = cDmg / bossData.maxHp;
                    const rewardExp = Math.max(1, Math.floor(bossData.exp * ratio));
                    const rewardGold = Math.max(1, Math.floor(bossData.gold * ratio));
                    
                    let sIdx = updatedStudents.findIndex(s => s.id === cId);
                    if (sIdx !== -1) {
                        let s = { ...updatedStudents[sIdx] };
                        s.exp += rewardExp;
                        s.gold += rewardGold;
                        
                        let gIdx = updatedGroups.findIndex(g => g.id === s.groupId);
                        if (gIdx !== -1) updatedGroups[gIdx].score += rewardExp;
                        
                        // 升級檢查
                        let reqExp = getExpReq(s.level);
                        while (s.exp >= reqExp) {
                            s.exp -= reqExp;
                            s.level += 1;
                            s.maxHp += 5;
                            const synergy = getGroupSynergy(s.groupId, updatedStudents);
                            s.hp = s.maxHp + synergy.hpBonus; 
                            reqExp = getExpReq(s.level);
                        }
                        updatedStudents[sIdx] = s;
                    }
                });
                return { updatedStudents, updatedGroups };
            };

            const handleBossAttack = (studentId, type, targetGroupId, damageDealt, damageTaken, healAmt, isDodged, currentBossId) => {
                let updatedStudents = [...students];
                let updatedGroups = [...groups];
                let sIndex = updatedStudents.findIndex(s => s.id === studentId);
                let student = { ...updatedStudents[sIndex] };
                const synergy = getGroupSynergy(student.groupId, updatedStudents);

                // 結算受傷
                if (damageTaken > 0 && !isDodged) {
                    student.hp -= damageTaken;
                    addLog(`🩸 ${student.name} 遭到魔王攻擊，失去 ${damageTaken} 點生命。`, student.classId);
                    
                    if (student.hp <= 0) {
                        const reviveIndex = student.inventory.findIndex(item => item.id === 'i2');
                        if (reviveIndex !== -1) {
                            student.inventory.splice(reviveIndex, 1);
                            student.hp = student.maxHp + synergy.hpBonus;
                            addLog(`✨ ${student.name} 倒下了，但使用了【復活十字章】滿血復活！`, student.classId);
                        } else {
                            student.hp = 0; 
                            const oldLevel = student.level;
                            student.level = Math.max(1, student.level - 5);
                            student.maxHp = 20 + (student.level - 1) * 5; 
                            student.exp = 0; 
                            const levelLoss = oldLevel - student.level;
                            if (levelLoss > 0) addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，並受到死亡懲罰失去了 ${levelLoss} 級修為！`, student.classId);
                            else addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，需等待救援或使用道具。`, student.classId);
                        }
                    }
                } else if (isDodged) {
                    addLog(`💨 ${student.name} 敏捷地閃避了魔王的致命攻擊！`, student.classId);
                }

                // 結算回復 (自身羈絆)
                if (student.hp > 0 && healAmt > 0) {
                    const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                    student.hp = Math.min(student.hp + healAmt, effectiveMaxHp);
                    addLog(`✨ 觸發神聖治癒！${student.name} 恢復了 ${healAmt} 點生命。`, student.classId);
                }

                updatedStudents[sIndex] = student;

                // 牧師全隊回復與復活
                const aliveClerics = updatedStudents.filter(s => s.groupId === student.groupId && s.job === '牧師' && s.hp > 0);
                if (aliveClerics.length > 0) {
                    let healedOthers = false;
                    let revivedMemberName = null;
                    const deadMembers = updatedStudents.filter(s => s.groupId === student.groupId && s.hp <= 0);
                    let targetReviveId = null;
                    
                    if (deadMembers.length > 0) {
                        const target = deadMembers[Math.floor(Math.random() * deadMembers.length)];
                        targetReviveId = target.id;
                        revivedMemberName = target.name;
                    }

                    updatedStudents = updatedStudents.map(s => {
                        if (s.groupId === student.groupId) {
                            const memberSynergy = getGroupSynergy(s.groupId, updatedStudents);
                            const effMaxHp = s.maxHp + memberSynergy.hpBonus;
                            if (s.id === targetReviveId) {
                                return { ...s, hp: Math.floor(effMaxHp / 2) || 1 }; 
                            } else if (s.hp > 0) {
                                if (s.hp < effMaxHp && s.id !== student.id) healedOthers = true;
                                return { ...s, hp: Math.min(s.hp + 5, effMaxHp) }; 
                            }
                        }
                        return s;
                    });
                    if (revivedMemberName) addLog(`👼 奇蹟降臨！牧師的神聖祈禱將 ${revivedMemberName} 從死亡邊緣拉了回來！`, student.classId);
                    if (healedOthers) addLog(`✨ 聖光普照！牧師的祈禱為小隊成員恢復了 5 點生命。`, student.classId);
                }

                student = updatedStudents.find(s => s.id === student.id); // 更新當前學生參考

                // 結算對魔王傷害
                if (damageDealt > 0) {
                    addLog(`⚔️ ${student.name} 對魔王造成了 ${damageDealt} 點傷害！`, student.classId);
                    
                    if (type === 'squad') {
                        let bossData = { ...squadBosses[targetGroupId] };
                        if (bossData && bossData.id === currentBossId) {
                            bossData.currentHp -= damageDealt;
                            bossData.contributions = bossData.contributions || {};
                            bossData.contributions[studentId] = (bossData.contributions[studentId] || 0) + damageDealt;
                            
                            if (bossData.currentHp <= 0) {
                                addLog(`🎉 【${getGroup(targetGroupId).name}】成功擊殺了迷宮魔王 ${bossData.name}！`, student.classId);
                                const res = distributeBossRewards(bossData, updatedStudents, updatedGroups);
                                updatedStudents = res.updatedStudents;
                                updatedGroups = res.updatedGroups;
                                setSquadBosses(prev => { const n = {...prev}; delete n[targetGroupId]; return n; });
                            } else {
                                setSquadBosses(prev => ({ ...prev, [targetGroupId]: bossData }));
                            }
                        }
                    } else if (type === 'guild') {
                        let bossData = { ...guildBoss };
                        if (bossData && bossData.id === currentBossId) {
                            bossData.currentHp -= damageDealt;
                            bossData.contributions = bossData.contributions || {};
                            bossData.contributions[studentId] = (bossData.contributions[studentId] || 0) + damageDealt;
                            
                            if (bossData.currentHp <= 0) {
                                addLog(`🏆 全公會齊心協力，成功擊殺了世界首領 ${bossData.name}！`, null);
                                const res = distributeBossRewards(bossData, updatedStudents, updatedGroups);
                                updatedStudents = res.updatedStudents;
                                updatedGroups = res.updatedGroups;
                                setGuildBoss(null);
                            } else {
                                setGuildBoss(bossData);
                            }
                        }
                    }
                }

                setStudents(updatedStudents);
                setGroups(updatedGroups);
            };

            const handleQuestResult = (studentId, monsterIdOrObj, isCorrect, combatData) => {
                const monster = typeof monsterIdOrObj === 'string' ? MONSTERS.find(m => m.id === monsterIdOrObj) : monsterIdOrObj;
                let updatedStudents = [...students];
                let updatedGroups = [...groups];
                let sIndex = updatedStudents.findIndex(s => s.id === studentId);
                let student = { ...updatedStudents[sIndex] };
                let gIndex = updatedGroups.findIndex(g => g.id === student.groupId);
                
                const synergy = getGroupSynergy(student.groupId, updatedStudents);
                const { finalExp, finalGold, finalDmg, healAmt, isDodged } = combatData;

                if (isCorrect) {
                    student.exp += finalExp;
                    student.gold += finalGold;
                    if(gIndex !== -1) updatedGroups[gIndex].score += finalExp; 
                    addLog(`🌟 ${student.name} 擊敗了 ${monster.name}！獲得 ${finalExp} EXP, ${finalGold} 金幣。`, student.classId);
                    if (synergy.active && synergy.expGoldMult > 1) {
                        addLog(`✨ 觸發小隊羈絆【${synergy.name}】！獲得額外收益。`, student.classId);
                    }
                } else {
                    if (isDodged) {
                        addLog(`💨 ${student.name} 敏捷地閃避了 ${monster.name} 的致命攻擊！`, student.classId);
                    } else {
                        student.hp -= finalDmg;
                        addLog(`🩸 ${student.name} 遭到 ${monster.name} 攻擊，失去 ${finalDmg} 點生命。`, student.classId);
                    }

                    if (student.hp <= 0) {
                        const reviveIndex = student.inventory.findIndex(item => item.id === 'i2');
                        if (reviveIndex !== -1) {
                            student.inventory.splice(reviveIndex, 1);
                            student.hp = student.maxHp + synergy.hpBonus;
                            addLog(`✨ ${student.name} 倒下了，但使用了【復活十字章】滿血復活！`, student.classId);
                        } else {
                            student.hp = 0; 
                            const oldLevel = student.level;
                            student.level = Math.max(1, student.level - 5);
                            student.maxHp = 20 + (student.level - 1) * 5; 
                            student.exp = 0; 
                            const levelLoss = oldLevel - student.level;
                            if (levelLoss > 0) addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，並受到死亡懲罰失去了 ${levelLoss} 級修為！`, student.classId);
                            else addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，需等待救援或使用道具。`, student.classId);
                        }
                    }
                }

                if (student.hp > 0 && healAmt > 0) {
                    const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                    student.hp = Math.min(student.hp + healAmt, effectiveMaxHp);
                    addLog(`✨ 觸發神聖治癒！${student.name} 恢復了 ${healAmt} 點生命。`, student.classId);
                }

                updatedStudents[sIndex] = student;

                const aliveClerics = updatedStudents.filter(s => s.groupId === student.groupId && s.job === '牧師' && s.hp > 0);
                if (aliveClerics.length > 0) {
                    let healedOthers = false;
                    let revivedMemberName = null;
                    const deadMembers = updatedStudents.filter(s => s.groupId === student.groupId && s.hp <= 0);
                    let targetReviveId = null;
                    
                    if (deadMembers.length > 0) {
                        const target = deadMembers[Math.floor(Math.random() * deadMembers.length)];
                        targetReviveId = target.id;
                        revivedMemberName = target.name;
                    }

                    updatedStudents = updatedStudents.map(s => {
                        if (s.groupId === student.groupId) {
                            const memberSynergy = getGroupSynergy(s.groupId, updatedStudents);
                            const effMaxHp = s.maxHp + memberSynergy.hpBonus;
                            if (s.id === targetReviveId) {
                                return { ...s, hp: Math.floor(effMaxHp / 2) || 1 }; 
                            } else if (s.hp > 0) {
                                if (s.hp < effMaxHp && s.id !== student.id) healedOthers = true;
                                return { ...s, hp: Math.min(s.hp + 5, effMaxHp) }; 
                            }
                        }
                        return s;
                    });
                    if (revivedMemberName) addLog(`👼 奇蹟降臨！牧師的神聖祈禱將 ${revivedMemberName} 從死亡邊緣拉了回來！`, student.classId);
                    if (healedOthers) addLog(`✨ 聖光普照！牧師的祈禱為小隊成員恢復了 5 點生命。`, student.classId);
                }

                student = updatedStudents.find(s => s.id === student.id); 

                let reqExp = getExpReq(student.level);
                let leveledUp = false;
                while (student.exp >= reqExp) {
                    student.exp -= reqExp;
                    student.level += 1;
                    student.maxHp += 5;
                    student.hp = student.maxHp + synergy.hpBonus; 
                    leveledUp = true;
                    reqExp = getExpReq(student.level);
                }
                
                if (leveledUp) {
                    addLog(`🆙 ${student.name} 升級到了等級 ${student.level}！(可至商行購買轉職憑證)`, student.classId);
                }

                updatedStudents[sIndex] = student;
                setStudents(updatedStudents);
                setGroups(updatedGroups);
            };

            const changeJob = (studentId, newJob) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex] = { ...updated[sIndex], job: newJob };
                setStudents(updated);
                setShowJobModal(null);
                addLog(`🎉 ${updated[sIndex].name} 成功轉職為【${newJob}】！`, updated[sIndex].classId);
            };

            const saveAvatar = (studentId, newAvatarObj) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar = newAvatarObj;
                setStudents(updated);
                setEditingAvatarId(null);
                addLog(`✨ ${updated[sIndex].name} 改變了造型外觀！`, updated[sIndex].classId);
            };

            const handleApproveCustomAvatar = (studentId) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar.customImageStatus = 'approved';
                setStudents(updated);
                addLog(`✅ 教師已核准 ${updated[sIndex].name} 的 Reroll 自訂頭像！`, updated[sIndex].classId);
            };

            const handleRejectCustomAvatar = (studentId) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar.customImageStatus = 'rejected';
                setStudents(updated);
                addLog(`❌ 教師已駁回 ${updated[sIndex].name} 的頭像申請，請重新上傳。`, updated[sIndex].classId);
            };

            const buyItem = (studentId, item) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                let student = { ...updated[sIndex] };
                
                if (student.gold >= item.cost) {
                    if (item.id === 'i_job') {
                        if (student.level < 5) {
                            alert("等級不足 5 級，公會不受理您的轉職申請！請繼續努力。");
                            return;
                        }
                        student.gold -= item.cost;
                        updated[sIndex] = student;
                        setStudents(updated);
                        setShowJobModal(student);
                        addLog(`📜 ${student.name} 花費 ${item.cost} G 購買了皇家轉職憑證，準備轉職！`, student.classId);
                        return; 
                    }

                    student.gold -= item.cost;
                    if (item.type === 'consumable') {
                        const synergy = getGroupSynergy(student.groupId, updatedStudents);
                        const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                        student = item.effect(student, effectiveMaxHp);
                        addLog(`🧪 ${student.name} 使用了 ${item.name}。`, student.classId);
                    } else if (item.type === 'equipment') {
                        student.equipment = item;
                        addLog(`⚔️ ${student.name} 裝備了 ${item.name}。`, student.classId);
                    } else if (item.type === 'frame') {
                        if (!student.avatar.unlockedFrames.includes(item.value)) {
                            student.avatar.unlockedFrames.push(item.value);
                            student.avatar.frameClass = item.value; 
                            addLog(`👑 ${student.name} 購買並裝備了高階外框：${item.name}。`, student.classId);
                        }
                    } else {
                        student.inventory.push(item);
                        addLog(`🛍️ ${student.name} 購買了 ${item.name}。`, student.classId);
                    }
                    updated[sIndex] = student;
                    setStudents(updated);
                } else {
                    alert("金幣不足！");
                }
            };

            const handleAddClass = (name) => {
                const newId = classes.length > 0 ? Math.max(...classes.map(c => c.id)) + 1 : 1;
                setClasses([...classes, { id: newId, name }]);
                addLog(`📜 建立了新的編制班級：${name}`, null);
            };

            const handleAddGroup = (namesStr, classId) => {
                const names = namesStr.split(/[,，\n、]+/).map(n => n.trim()).filter(n => n);
                if (names.length === 0) return;
                setGroups(prev => {
                    let maxId = prev.length > 0 ? Math.max(...prev.map(g => g.id)) : 0;
                    const newGroups = names.map((name, i) => ({ id: maxId + i + 1, classId: parseInt(classId), name, score: 0 }));
                    return [...prev, ...newGroups];
                });
                addLog(`🛡️ 成立了新的冒險小隊：${names.join('、')}`, parseInt(classId));
            };

            const handleAddStudent = (namesStr, classId, groupId) => {
                const names = namesStr.split(/[,，\n、]+/).map(n => n.trim()).filter(n => n);
                if (names.length === 0) return;
                setStudents(prev => {
                    let maxId = prev.length > 0 ? Math.max(...prev.map(s => s.id)) : 0;
                    const newStudents = names.map((name, i) => ({
                        id: maxId + i + 1, classId: parseInt(classId), groupId: parseInt(groupId), 
                        name, level: 1, exp: 0, gold: 50, hp: 20, maxHp: 20, job: '新手', inventory: [], equipment: null, avatar: defaultAvatar(name)
                    }));
                    return [...prev, ...newStudents];
                });
                addLog(`⚔️ 招募了新的冒險者：${names.join('、')}`, parseInt(classId));
            };

            const handleLogout = () => {
                setCurrentClassId(null);
                setShopBuyerId(null);
                setView('dashboard');
            };

            const getGroup = (id) => groups.find(g => g.id === id);
            const getClassObj = (id) => classes.find(c => c.id === id);

            if (currentClassId === null) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative z-10 animate-fade-in">
                        <div className="panel p-8 md:p-12 max-w-4xl w-full text-center shadow-[0_0_50px_rgba(197,159,68,0.15)]">
                            <i className="fa-solid fa-dragon text-6xl text-guild-gold mb-4"></i>
                            <h1 className="text-4xl font-bold text-guild-gold mb-2 tracking-widest">自然科學冒險者公會</h1>
                            <p className="text-guild-paper/70 mb-10 text-lg">世界地圖 - 請選擇您要進入的分會大廳</p>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-10">
                                {classes.map(c => (
                                    <button key={c.id} onClick={() => setCurrentClassId(c.id)} className="panel p-8 border border-guild-gold/30 hover:border-guild-gold hover:bg-guild-gold/10 transition group transform hover:-translate-y-1">
                                        <i className="fa-solid fa-dungeon text-4xl text-gray-500 group-hover:text-guild-gold mb-4 transition duration-300"></i>
                                        <h3 className="text-2xl font-bold text-guild-paper group-hover:text-white transition">{c.name}</h3>
                                        <p className="text-xs text-gray-500 mt-2">進入分會</p>
                                    </button>
                                ))}
                            </div>
                            <div className="border-t border-guild-gold/30 pt-8 pb-4 max-w-md mx-auto">
                                <h4 className="text-guild-gold mb-3 font-bold"><i className="fa-solid fa-hammer mr-2"></i>拓荒建立新分會</h4>
                                <div className="flex gap-2">
                                    <input type="text" id="newClassInput" placeholder="輸入新班級名稱 (如: 703班)" className="flex-1 p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none focus:border-guild-gold transition" />
                                    <button onClick={() => { const v = document.getElementById('newClassInput').value; if(v){ handleAddClass(v); document.getElementById('newClassInput').value=''; } }} className="px-6 py-3 bg-guild-gold text-guild-dark font-bold rounded hover:bg-yellow-500 transition shadow-lg">建立</button>
                                </div>
                            </div>
                            <div className="mt-8 pt-4">
                                <button onClick={() => { setCurrentClassId('admin'); setView('admin'); }} className="text-gray-500 hover:text-guild-gold transition text-sm flex items-center justify-center w-full">
                                    <i className="fa-solid fa-gear mr-2"></i> 進入教師辦公室 (管理後台)
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col min-h-screen animate-fade-in">
                    <nav className="w-full panel rounded-none border-b border-guild-gold/30 p-4 flex flex-col md:flex-row items-center justify-between gap-4 z-20 sticky top-0 shadow-lg">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-dragon text-3xl text-guild-gold"></i>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-guild-gold tracking-widest leading-none">冒險者公會</h1>
                                    <p className="text-xs text-guild-paper/70 mt-1">[{currentClassId === 'admin' ? '全公會管理中心' : getClassObj(currentClassId)?.name}] 分會大廳</p>
                                </div>
                            </div>
                            <div className="hidden md:flex gap-2">
                                {currentClassId !== 'admin' && (
                                    <>
                                        <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded transition ${view==='dashboard'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-chess-board mr-2"></i> 公會大廳</button>
                                        <button onClick={() => setView('roster')} className={`px-4 py-2 rounded transition ${view==='roster'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-users mr-2"></i> 冒險者名冊</button>
                                        <button onClick={() => setView('quest')} className={`px-4 py-2 rounded transition ${view==='quest'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-scroll mr-2"></i> 任務看板</button>
                                    </>
                                )}
                                {currentClassId === 'admin' && (
                                    <button className="px-4 py-2 rounded transition bg-guild-gold text-guild-dark font-bold"><i className="fa-solid fa-gavel mr-2"></i> 頭像審核中心</button>
                                )}
                            </div>
                        </div>
                        <button onClick={handleLogout} className="px-4 py-2 bg-guild-dark border border-gray-600 hover:bg-red-900/50 hover:border-red-500 hover:text-white text-gray-400 font-bold rounded transition text-sm flex items-center">
                            <i className="fa-solid fa-right-from-bracket mr-2"></i> 返回世界地圖
                        </button>
                    </nav>

                    {currentClassId !== 'admin' && (
                        <div className="md:hidden flex flex-wrap justify-center gap-2 bg-guild-dark p-2 border-b border-guild-gold/10">
                            <button onClick={() => setView('dashboard')} className={`px-3 py-1 rounded text-sm transition ${view==='dashboard'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>大廳</button>
                            <button onClick={() => setView('roster')} className={`px-3 py-1 rounded text-sm transition ${view==='roster'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>名冊</button>
                            <button onClick={() => setView('quest')} className={`px-3 py-1 rounded text-sm transition ${view==='quest'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>任務</button>
                        </div>
                    )}

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {view === 'admin' && <AdminPanel students={students} onApprove={handleApproveCustomAvatar} onReject={handleRejectCustomAvatar} />}
                        {view === 'dashboard' && <Dashboard classId={currentClassId} groups={groups} students={students} logs={logs} />}
                        {view === 'roster' && <Roster classId={currentClassId} groups={groups} students={students} getGroup={getGroup} onOpenShop={setShopBuyerId} onOpenAvatarEditor={setEditingAvatarId} onAddGroup={handleAddGroup} onAddStudent={handleAddStudent} />}
                        {view === 'quest' && <QuestBoard classId={currentClassId} students={students} groups={groups} squadBosses={squadBosses} guildBoss={guildBoss} onResult={handleQuestResult} onSpawnBoss={handleSpawnBoss} onBossAttack={handleBossAttack} />}
                    </main>

                    {/* Modal Layer */}
                    {shopBuyerId && <Shop buyer={students.find(s => s.id === shopBuyerId)} onBuy={buyItem} onClose={() => setShopBuyerId(null)} />}
                    {editingAvatarId && <AvatarEditor student={students.find(s => s.id === editingAvatarId)} onSave={saveAvatar} onClose={() => setEditingAvatarId(null)} />}
                    
                    {/* ★ 轉職視窗 (買卡後觸發) */}
                    {showJobModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="panel p-6 max-w-5xl w-full text-center border-guild-gold shadow-[0_0_40px_rgba(197,159,68,0.4)]">
                                <h2 className="text-3xl font-bold text-guild-gold mb-2">🎉 {showJobModal.name} 準備轉職！</h2>
                                <p className="mb-6 text-gray-300">歷經無數考驗與沉澱，請選擇你未來的專屬戰鬥之道。</p>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    {['戰士', '法師', '遊俠', '刺客', '牧師'].map(job => (
                                        <button key={job} onClick={() => changeJob(showJobModal.id, job)} className="panel p-4 bg-guild-dark/50 hover:bg-guild-dark hover:border-guild-gold transition flex flex-col items-center gap-3 group">
                                            <i className={`fa-solid ${JOBS[job].icon} text-5xl ${JOBS[job].color} drop-shadow-[0_0_10px_currentColor] group-hover:scale-110 transition-transform duration-300`}></i>
                                            <span className="font-bold text-xl text-guild-paper">{job}</span>
                                            <span className="text-xs text-gray-400 h-10 flex items-center justify-center">{JOBS[job].bonus}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
