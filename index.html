        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return await response.json();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }

            let descArr = [];
            if (dmgRed > 0) descArr.push(`受傷-${dmgRed}`);
            if (expGoldMult > 1) descArr.push(`收益+${Math.round((expGoldMult-1)*100)}%`);
            if (hpBonus > 0) descArr.push(`血量+${hpBonus}`);
            if (dodgeChance > 0) descArr.push(`閃避+${Math.round(dodgeChance*100)}%`);
            if (healAmount > 0) descArr.push(`恢復+${healAmount}`);

            return { active, name: active ? name : '', tags, expGoldMult, dmgRed, hpBonus, dodgeChance, healAmount, desc: descArr.join(' | ') };
        };

        const AvatarDisplay = ({ student, size = "w-16 h-16", showJob = true, previewPending = false }) => {
            if (!student || !student.avatar) return null;
            const { avatar, job } = student;
            const showCustom = avatar.customImage && (avatar.customImageStatus === 'approved' || (previewPending && avatar.customImageStatus === 'pending'));
            const skinColor = AVATAR_OPTIONS.skinColor.some(o => o.id === avatar.skinColor) ? avatar.skinColor : 'f2d3b1';
            const hairColor = AVATAR_OPTIONS.hairColor.some(o => o.id === avatar.hairColor) ? avatar.hairColor : '111111';
            const head = AVATAR_OPTIONS.head.some(o => o.id === avatar.head) ? avatar.head : 'variant01';
            const hair = AVATAR_OPTIONS.hair.some(o => o.id === avatar.hair) ? avatar.hair : 'variant01';
            const eyes = AVATAR_OPTIONS.eyes.some(o => o.id === avatar.eyes) ? avatar.eyes : 'variant01';
            const eyebrows = AVATAR_OPTIONS.eyebrows.some(o => o.id === avatar.eyebrows) ? avatar.eyebrows : 'variant01';
            const mouth = AVATAR_OPTIONS.mouth.some(o => o.id === avatar.mouth) ? avatar.mouth : 'happy01';
            const glasses = AVATAR_OPTIONS.glasses.some(o => o.id === avatar.glasses) ? avatar.glasses : 'none';
            const freckles = AVATAR_OPTIONS.freckles.some(o => o.id === avatar.freckles) ? avatar.freckles : '0';
            const seed = encodeURIComponent(avatar.seed || student.name);
            
            let url = `https://api.dicebear.com/9.x/lorelei/svg?seed=${seed}&head=${head}&hair=${hair}&eyes=${eyes}&eyebrows=${eyebrows}&mouth=${mouth}&skinColor=${skinColor}&hairColor=${hairColor}&backgroundColor=transparent`;
            url += glasses !== 'none' ? `&glasses=${glasses}&glassesProbability=100` : `&glassesProbability=0`;
            url += freckles === '100' ? `&frecklesProbability=100` : `&frecklesProbability=0`;

            return (
                <div className={`relative flex-shrink-0 ${size} ${avatar.frameClass} border-2 border-solid rounded-lg box-border transition-all duration-300 bg-guild-panel flex items-center justify-center overflow-hidden shadow-inner`}>
                    {showCustom ? (
                        <img src={avatar.customImage} alt={student.name} className="w-full h-full object-cover image-rendering-pixelated" style={{imageRendering: 'pixelated'}} />
                    ) : (
                        <img src={url} alt={student.name} className="w-[115%] h-[115%] object-contain origin-bottom transform scale-110" onError={(e) => { e.target.onerror = null; e.target.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"; }} />
                    )}
                    {avatar.customImageStatus === 'pending' && previewPending && <div className="absolute inset-0 bg-black/60 flex items-center justify-center text-yellow-400 text-xs font-bold z-20 backdrop-blur-[1px]">審核中</div>}
                    {showJob && job !== '新手' && (
                        <div className="absolute -bottom-2 -right-2 bg-guild-dark border border-guild-gold rounded-full w-6 h-6 flex items-center justify-center text-[10px] shadow-lg z-30">
                            <i className={`fa-solid ${JOBS[job].icon} ${JOBS[job].color}`}></i>
                        </div>
                    )}
                </div>
            );
        };

        const getVfxStyle = (baseStyle, extraFilter) => ({ ...baseStyle, filter: extraFilter });

        const VFXOverlay = ({ type, level = 1 }) => {
            if (!type) return null;
            const scaleMod = Math.min(1 + ((level - 1) * 0.15), 3);
            const opacityMod = Math.min(0.6 + ((level - 1) * 0.05), 1);
            const baseStyle = { transform: `scale(${scaleMod})`, opacity: opacityMod };

            if (type === 'warrior') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-warrior"><div style={baseStyle} className="w-3 h-48 bg-white rounded-full shadow-[0_0_20px_white]"></div></div>;
            if (type === 'mage') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-mage"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 20px cyan)')} className="fa-solid fa-sun text-7xl text-cyan-300"></i></div>;
            if (type === 'ranger') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-ranger"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 15px lime)')} className="fa-solid fa-angles-right text-7xl text-green-300"></i></div>;
            if (type === 'assassin') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-assassin"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 15px purple)')} className="fa-solid fa-khanda text-7xl text-purple-400"></i></div>;
            if (type === 'cleric') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-cleric"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 20px yellow)')} className="fa-solid fa-cross text-7xl text-yellow-300"></i></div>;
            if (type === 'novice') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-novice"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 15px gray)')} className="fa-solid fa-hand-fist text-6xl text-gray-200"></i></div>;
            if (type === 'monster') return <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-50 vfx-monster"><i style={getVfxStyle(baseStyle, 'drop-shadow(0 0 20px red)')} className="fa-solid fa-paw text-7xl text-white"></i></div>;
            return null;
        };

        const MonsterDisplay = ({ monster, isSpinning = false }) => {
            if (!monster) return null;
            const borderColor = monster.color.replace('text-', 'border-');
            const bgColor = monster.color.replace('text-', 'bg-');
            
            if (isSpinning) {
                return (
                    <div className="relative w-full h-full flex items-center justify-center">
                        <i className={`fa-solid ${monster.icon} text-[5rem] ${monster.color}`}></i>
                    </div>
                );
            }

            return (
                <div className="relative w-full h-full flex items-center justify-center group">
                    <div className={`absolute w-[130%] h-[130%] rounded-full border-[3px] border-dashed animate-[spin_12s_linear_infinite] opacity-30 ${borderColor}`}></div>
                    <div className={`absolute w-[100%] h-[100%] rounded-full border-[4px] border-dotted animate-[spin_6s_linear_reverse_infinite] opacity-50 ${borderColor}`}></div>
                    <div className={`absolute w-20 h-20 rounded-full animate-pulse opacity-40 blur-2xl ${bgColor}`}></div>
                    <div className={`absolute inset-0 opacity-60 rounded-lg blur-md mix-blend-screen bg-gradient-to-t from-${monster.color.split('-')[1]}-900/60 to-transparent`}></div>
                    
                    <div className="absolute inset-0 overflow-hidden pointer-events-none rounded-lg">
                        <div className={`absolute bottom-2 left-1/4 w-1.5 h-1.5 rounded-full anim-float-up opacity-70 ${bgColor}`} style={{animationIterationCount: 'infinite', animationDuration: '2s'}}></div>
                        <div className={`absolute bottom-4 right-1/3 w-2.5 h-2.5 rounded-full anim-float-up opacity-50 ${bgColor}`} style={{animationIterationCount: 'infinite', animationDuration: '3s', animationDelay: '0.5s'}}></div>
                        <div className={`absolute bottom-1 right-1/4 w-1 h-1 rounded-full anim-float-up opacity-80 ${bgColor}`} style={{animationIterationCount: 'infinite', animationDuration: '2.5s', animationDelay: '1s'}}></div>
                    </div>

                    <i className={`fa-solid ${monster.icon} text-[5rem] ${monster.color} relative z-10 animate-[pulse_3s_ease-in-out_infinite] transform group-hover:scale-125 transition-transform duration-500`} style={{ filter: 'drop-shadow(0 0 15px currentColor)' }}></i>
                </div>
            );
        };

        const Dashboard = ({ classId, groups, students, logs }) => {
            const branchGroups = groups.filter(g => g.classId === classId).sort((a, b) => b.score - a.score);
            const branchStudents = students.filter(s => s.classId === classId).sort((a, b) => b.level - a.level || b.exp - a.exp).slice(0, 5);
            const branchLogs = logs.filter(l => l.classId === classId || l.classId === null);

            return (
                <div className="space-y-6 max-w-6xl mx-auto animate-fade-in">
                    <h2 className="text-3xl font-bold text-guild-gold border-b border-guild-gold/30 pb-2">大廳總覽</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="panel p-6">
                            <h3 className="text-xl text-guild-paper mb-4"><i className="fa-solid fa-flag text-guild-gold mr-2"></i>小隊榮譽榜</h3>
                            <div className="space-y-4 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                                {branchGroups.map((g, index) => {
                                    const synergy = getGroupSynergy(g.id, students);
                                    return (
                                        <div key={g.id} className="flex items-center justify-between bg-guild-dark p-3 rounded border border-guild-paper/10">
                                            <div className="flex items-center gap-3">
                                                <span className={`text-2xl font-bold ${index === 0 ? 'text-yellow-400' : index === 1 ? 'text-gray-300' : index === 2 ? 'text-yellow-700' : 'text-guild-paper'}`}>#{index + 1}</span>
                                                <div>
                                                    <div className="text-lg">{g.name}</div>
                                                    {synergy.active && (
                                                        <div className="text-[10px] text-purple-400 border border-purple-400/30 bg-purple-900/20 px-1.5 py-0.5 rounded inline-block mt-0.5" title={synergy.desc}>
                                                            <i className="fa-solid fa-link mr-1"></i> {synergy.name}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="text-xl font-bold text-guild-gold">{g.score} <span className="text-sm font-normal text-gray-400">EXP</span></div>
                                        </div>
                                    );
                                })}
                                {branchGroups.length === 0 && <div className="text-gray-500 text-center py-4">尚無小隊資料，請前往名冊招募！</div>}
                            </div>
                        </div>
                        <div className="panel p-6">
                            <h3 className="text-xl text-guild-paper mb-4"><i className="fa-solid fa-medal text-guild-gold mr-2"></i>傳奇冒險者</h3>
                            <div className="space-y-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                                {branchStudents.map((s, index) => (
                                    <div key={s.id} className="flex items-center justify-between bg-guild-dark p-2 rounded">
                                        <div className="flex items-center gap-3">
                                            <AvatarDisplay student={s} size="w-10 h-10" showJob={false} />
                                            <div>
                                                <div className="font-bold flex items-center gap-2">{s.name} <i className={`fa-solid ${JOBS[s.job].icon} ${JOBS[s.job].color} text-xs`}></i></div>
                                                <div className="text-xs text-gray-400">Lv.{s.level} {s.job}</div>
                                            </div>
                                        </div>
                                        <div className="text-guild-gold font-bold">{s.level * 1000 + s.exp} <span className="text-xs text-gray-500">總分</span></div>
                                    </div>
                                ))}
                                {branchStudents.length === 0 && <div className="text-gray-500 text-center py-4">尚無冒險者資料</div>}
                            </div>
                        </div>
                    </div>
                    <div className="panel p-6 mt-6">
                        <h3 className="text-xl text-guild-gold mb-4"><i className="fa-solid fa-book-journal-whills mr-2"></i>分會日誌</h3>
                        <div className="text-sm space-y-2 h-40 overflow-y-auto pr-2 opacity-80 bg-guild-dark p-4 rounded border border-guild-paper/10 font-mono custom-scrollbar">
                            {branchLogs.map((log, i) => (
                                <div key={i} className="border-b border-gray-700/50 pb-1 mb-1 last:border-0"><span className="text-gray-500 mr-2">[{log.time}]</span> {log.msg}</div>
                            ))}
                            {branchLogs.length === 0 && <div className="text-gray-500">尚無紀錄...</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const Roster = ({ classId, groups, students, getGroup, onOpenShop, onOpenAvatarEditor, onAddGroup, onAddStudent }) => {
            const [showManageModal, setShowManageModal] = useState(false);
            const [manageTab, setManageTab] = useState('student'); 
            const [newGroupName, setNewGroupName] = useState('');
            const [newStudentName, setNewStudentName] = useState('');
            const [newStudentGroupId, setNewStudentGroupId] = useState('');

            const branchStudents = students.filter(s => s.classId === classId);
            const branchGroups = groups.filter(g => g.classId === classId);

            return (
                <div className="max-w-7xl mx-auto animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-guild-gold/30 pb-4 mb-6 gap-4">
                        <h2 className="text-3xl font-bold text-guild-gold">冒險者名冊</h2>
                        <button onClick={() => setShowManageModal(true)} className="px-4 py-2 bg-blue-900 hover:bg-blue-800 text-white font-bold rounded border border-blue-600 transition shadow flex items-center">
                            <i className="fa-solid fa-user-plus mr-2"></i> 招募與編制
                        </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                        {branchStudents.map(s => {
                            const synergy = getGroupSynergy(s.groupId, students);
                            const effectiveMaxHp = s.maxHp + synergy.hpBonus;
                            const hpPercent = Math.min((s.hp / effectiveMaxHp) * 100, 100);
                            const expPercent = (s.exp / (s.level * 100)) * 100;
                            const groupName = getGroup(s.groupId)?.name || '無小隊';
                            
                            return (
                                <div key={s.id} className="panel p-4 relative overflow-hidden group hover:border-guild-gold/50 transition">
                                    {s.hp <= 0 && <div className="absolute inset-0 bg-red-900/50 flex items-center justify-center z-20 font-bold text-xl text-red-200 backdrop-blur-sm">已陣亡</div>}
                                    <div className="flex gap-4 items-start mb-3">
                                        <div className="cursor-pointer transform hover:scale-105 transition" onClick={() => onOpenAvatarEditor(s.id)} title="點擊開啟換裝室">
                                            <AvatarDisplay student={s} size="w-16 h-16" />
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-xs text-guild-gold truncate flex flex-col gap-1 mb-1">
                                                <span>{groupName}</span>
                                                {synergy.active && (
                                                    <div className="flex flex-wrap gap-1">
                                                        <span className="px-1.5 py-0.5 bg-purple-900/50 border border-purple-500/30 text-purple-300 rounded text-[9px] shrink-0" title={synergy.desc}>{synergy.name}</span>
                                                        {synergy.tags.map(t => <span key={t} className="px-1.5 py-0.5 bg-blue-900/50 border border-blue-500/30 text-blue-300 rounded text-[9px] shrink-0">{t}</span>)}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="text-lg font-bold flex items-center justify-between"><span className="truncate">{s.name}</span><span className="text-sm font-bold text-guild-paper">Lv.{s.level}</span></div>
                                            <div className="text-xs text-gray-400 mt-0.5">{s.job}</div>
                                        </div>
                                    </div>
                                    <div className="space-y-2 mt-2">
                                        <div>
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-red-400"><i className="fa-solid fa-heart mr-1"></i>HP</span><span>{s.hp}/{effectiveMaxHp}</span></div>
                                            <div className="hp-bar-container h-1.5"><div className="hp-bar-fill" style={{width: `${hpPercent}%`}}></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-[10px] mb-1"><span className="text-blue-400"><i className="fa-solid fa-star mr-1"></i>EXP</span><span>{s.exp}/{s.level * 100}</span></div>
                                            <div className="exp-bar-container h-1"><div className="exp-bar-fill" style={{width: `${expPercent}%`}}></div></div>
                                        </div>
                                        <div className="flex justify-between items-center text-xs pt-3 border-t border-guild-paper/10 text-guild-gold">
                                            <span className="font-bold"><i className="fa-solid fa-coins mr-1"></i>{s.gold}</span>
                                            <span className="flex gap-1.5">
                                                {s.equipment && <span title={s.equipment.name}><i className="fa-solid fa-khanda text-gray-300"></i></span>}
                                                {s.inventory.map(i => i.id === 'i2' ? <span key={Math.random()} title="復活十字章"><i className="fa-solid fa-ankh text-yellow-500"></i></span> : null)}
                                            </span>
                                        </div>
                                        <button onClick={() => onOpenShop(s.id)} className="mt-3 w-full py-2 bg-guild-dark hover:bg-guild-gold hover:text-guild-dark text-guild-paper border border-gray-600 hover:border-guild-gold rounded text-xs transition font-bold">
                                            <i className="fa-solid fa-store mr-1"></i> 進入商行
                                        </button>
                                    </div>
                                </div>
                            )
                        })}
                        {branchStudents.length === 0 && <div className="col-span-full text-center py-16 text-gray-500 bg-guild-dark rounded border border-dashed border-gray-700">這裡目前空無一人，趕快點擊右上角「招募與編制」來增加冒險者吧！</div>}
                    </div>

                    {showManageModal && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="panel p-0 max-w-lg w-full flex flex-col relative border-guild-gold overflow-hidden">
                                <button onClick={() => setShowManageModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl transition hover:rotate-90 z-10"><i className="fa-solid fa-xmark"></i></button>
                                <div className="flex bg-guild-dark border-b border-guild-gold/30">
                                    <button onClick={() => setManageTab('student')} className={`flex-1 py-4 text-center font-bold transition ${manageTab === 'student' ? 'bg-guild-gold text-guild-dark' : 'text-gray-400 hover:bg-guild-gold/20'}`}>招募冒險者</button>
                                    <button onClick={() => setManageTab('group')} className={`flex-1 py-4 text-center font-bold transition ${manageTab === 'group' ? 'bg-guild-gold text-guild-dark' : 'text-gray-400 hover:bg-guild-gold/20'}`}>新增小隊</button>
                                </div>
                                <div className="p-6 bg-guild-panel">
                                    {manageTab === 'group' && (
                                        <div className="space-y-4 animate-fade-in">
                                            <h3 className="text-xl text-guild-gold font-bold mb-2">於本分會成立新小隊</h3>
                                            <div>
                                                <label className="block text-sm text-guild-paper mb-1">小隊名稱 <span className="text-gray-500 text-xs">(支援批次，請用逗號或換行分隔)</span></label>
                                                <textarea rows="3" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder="例如：獅鷲小隊, 獨角獸小隊..." className="w-full p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none custom-scrollbar" />
                                            </div>
                                            <button onClick={()=>{onAddGroup(newGroupName, classId); setNewGroupName('');}} className="w-full py-3 mt-4 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded transition">成立</button>
                                        </div>
                                    )}
                                    {manageTab === 'student' && (
                                        <div className="space-y-4 animate-fade-in">
                                            <h3 className="text-xl text-guild-gold font-bold mb-2">招募新血加入本分會</h3>
                                            <div>
                                                <label className="block text-sm text-guild-paper mb-1">所屬小隊</label>
                                                <select value={newStudentGroupId} onChange={e => setNewStudentGroupId(e.target.value)} className="w-full p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none">
                                                    <option value="">-- 請選擇小隊 --</option>
                                                    {branchGroups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm text-guild-paper mb-1">冒險者姓名 <span className="text-gray-500 text-xs">(支援批次，請用逗號或換行分隔)</span></label>
                                                <textarea rows="3" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} placeholder="例如：亞瑟, 梅林, 羅賓..." className="w-full p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none custom-scrollbar" />
                                            </div>
                                            <button onClick={()=>{onAddStudent(newStudentName, classId, newStudentGroupId); setNewStudentName('');}} className="w-full py-3 mt-4 bg-blue-800 hover:bg-blue-700 text-white font-bold rounded transition">招募</button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AvatarEditor = ({ student, onSave, onClose }) => {
            const [editConfig, setEditConfig] = useState({
                ...student.avatar,
                skinColor: AVATAR_OPTIONS.skinColor.some(o => o.id === student.avatar.skinColor) ? student.avatar.skinColor : 'f2d3b1',
                hairColor: AVATAR_OPTIONS.hairColor.some(o => o.id === student.avatar.hairColor) ? student.avatar.hairColor : '111111',
                head: AVATAR_OPTIONS.head.some(o => o.id === student.avatar.head) ? student.avatar.head : 'variant01',
                hair: AVATAR_OPTIONS.hair.some(o => o.id === student.avatar.hair) ? student.avatar.hair : 'variant01',
                eyes: AVATAR_OPTIONS.eyes.some(o => o.id === student.avatar.eyes) ? student.avatar.eyes : 'variant01',
                eyebrows: AVATAR_OPTIONS.eyebrows.some(o => o.id === student.avatar.eyebrows) ? student.avatar.eyebrows : 'variant01',
                mouth: AVATAR_OPTIONS.mouth.some(o => o.id === student.avatar.mouth) ? student.avatar.mouth : 'happy01',
                glasses: AVATAR_OPTIONS.glasses.some(o => o.id === student.avatar.glasses) ? student.avatar.glasses : 'none',
                freckles: AVATAR_OPTIONS.freckles.some(o => o.id === student.avatar.freckles) ? student.avatar.freckles : '0',
                customImage: student.avatar.customImage || null,
                customImageStatus: student.avatar.customImageStatus || 'none'
            });
            const [tab, setTab] = useState('custom');

            const handleSave = () => { onSave(student.id, editConfig); };
            const getRandomOpt = (opts) => opts[Math.floor(Math.random() * opts.length)].id;
            const handleRandomize = () => {
                setEditConfig({
                    ...editConfig,
                    seed: Math.random().toString(36).substring(7),
                    skinColor: getRandomOpt(AVATAR_OPTIONS.skinColor),
                    hairColor: getRandomOpt(AVATAR_OPTIONS.hairColor),
                    head: getRandomOpt(AVATAR_OPTIONS.head),
                    hair: getRandomOpt(AVATAR_OPTIONS.hair),
                    eyes: getRandomOpt(AVATAR_OPTIONS.eyes),
                    eyebrows: getRandomOpt(AVATAR_OPTIONS.eyebrows),
                    mouth: getRandomOpt(AVATAR_OPTIONS.mouth),
                    glasses: Math.random() > 0.8 ? getRandomOpt(AVATAR_OPTIONS.glasses.slice(1)) : 'none',
                    freckles: Math.random() > 0.8 ? '100' : '0',
                    customImage: null, customImageStatus: 'none'
                });
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 150; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        setEditConfig({ ...editConfig, customImage: dataUrl, customImageStatus: 'pending' });
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const TABS_CONFIG = [
                { id: 'custom', label: '自訂上傳(Reroll)', icon: 'fa-upload', color: 'text-green-400' },
                { id: 'blindBox', label: '盲盒', icon: 'fa-dice', color: 'text-blue-400' },
                { id: 'skinColor', label: '膚色' }, { id: 'head', label: '臉型' }, { id: 'hairColor', label: '染髮' },
                { id: 'hair', label: '髮型' }, { id: 'eyes', label: '眼睛' }, { id: 'eyebrows', label: '眉毛' },
                { id: 'mouth', label: '嘴巴' }, { id: 'glasses', label: '眼鏡' }, { id: 'freckles', label: '雀斑' },
                { id: 'frames', label: '外框', icon: 'fa-crown', color: 'text-yellow-500' }
            ];

            return (
                <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-50">
                    <div className="panel p-0 max-w-5xl w-full flex flex-col md:flex-row relative border-guild-gold shadow-[0_0_30px_rgba(197,159,68,0.3)]">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl transition hover:rotate-90 z-30"><i className="fa-solid fa-xmark"></i></button>
                        <div className="md:w-1/3 bg-guild-dark p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-guild-gold/30">
                            <h2 className="text-xl font-bold text-guild-gold mb-6"><i className="fa-solid fa-scissors mr-2"></i>冒險者換裝室</h2>
                            <AvatarDisplay student={{...student, avatar: editConfig}} size="w-48 h-48" showJob={true} previewPending={true} />
                            <div className="mt-6 text-center">
                                <div className="text-2xl font-bold tracking-wider text-guild-paper">{student.name}</div>
                                <div className="text-sm text-gray-400 mt-1">Lv.{student.level} {student.job}</div>
                            </div>
                        </div>
                        <div className="md:w-2/3 flex flex-col h-[65vh] md:h-[600px]">
                            <div className="flex overflow-x-auto bg-guild-dark border-b border-guild-gold/20 shrink-0 custom-scrollbar">
                                {TABS_CONFIG.map(t => (
                                    <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-4 text-sm font-bold whitespace-nowrap transition flex items-center gap-1 ${tab===t.id ? (t.color || 'bg-guild-gold text-guild-dark') : 'text-gray-400 hover:text-white'}`}>
                                        {t.icon && <i className={`fa-solid ${t.icon}`}></i>} {t.label}
                                    </button>
                                ))}
                            </div>
                            <div className="p-4 overflow-y-auto flex-1 bg-guild-panel/50 custom-scrollbar">
                                {tab === 'custom' && (
                                    <div className="flex flex-col items-center justify-center h-full text-center space-y-4 p-4">
                                        <h3 className="text-2xl text-green-400 font-bold mb-2"><i className="fa-solid fa-mobile-screen-button mr-2"></i>Reroll 專屬頭像上傳</h3>
                                        <p className="text-gray-300">想要擁有精靈耳、獸耳等與眾不同的種族外觀嗎？<br/>請前往 <a href="https://reroll.co" target="_blank" className="text-blue-400 font-bold underline hover:text-blue-300 transition">Reroll 網站</a> 製作專屬角色，截圖並上傳至此！</p>
                                        <p className="text-sm text-yellow-500 bg-yellow-900/20 p-3 rounded border border-yellow-900/30 max-w-sm mt-4"><i className="fa-solid fa-triangle-exclamation mr-1"></i> 上傳後，需由老師於後台審核通過，才會正式顯示於公會名冊中喔！</p>
                                        <div className="bg-guild-dark p-4 rounded-lg w-full max-w-sm border border-gray-600 mt-4">
                                            {editConfig.customImageStatus === 'none' && <div className="text-gray-400">尚未上傳自訂頭像。</div>}
                                            {editConfig.customImageStatus === 'pending' && <div className="text-yellow-400 font-bold"><i className="fa-solid fa-hourglass-half mr-2"></i>狀態：等待老師審核中...</div>}
                                            {editConfig.customImageStatus === 'approved' && <div className="text-green-400 font-bold"><i className="fa-solid fa-check mr-2"></i>狀態：已通過審核！</div>}
                                            {editConfig.customImageStatus === 'rejected' && <div className="text-red-400 font-bold"><i className="fa-solid fa-xmark mr-2"></i>狀態：被退回，請重新上傳。</div>}
                                        </div>
                                        <div className="mt-6 flex flex-wrap justify-center gap-4">
                                            <label className="cursor-pointer px-6 py-3 bg-green-700 hover:bg-green-600 text-white font-bold rounded shadow transition">
                                                <i className="fa-solid fa-cloud-arrow-up mr-2"></i> 選擇圖片上傳
                                                <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                            </label>
                                            {editConfig.customImage && (
                                                <button onClick={() => setEditConfig({...editConfig, customImage: null, customImageStatus: 'none'})} className="px-6 py-3 bg-red-900 hover:bg-red-800 text-white font-bold rounded shadow transition">
                                                    <i className="fa-solid fa-trash mr-2"></i> 移除自訂圖片
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                                {tab === 'blindBox' && (
                                    <div className="flex flex-col items-center justify-center h-full text-center space-y-6 p-4">
                                        <i className="fa-solid fa-wand-magic-sparkles text-6xl text-blue-400 opacity-80"></i>
                                        <p className="text-gray-300 text-lg">不知道該怎麼搭配嗎？<br/>點擊下方按鈕，命運之神將為您隨機抽取全新造型！</p>
                                        <button onClick={handleRandomize} className="px-8 py-4 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg border border-blue-500 transition text-xl transform hover:scale-105"><i className="fa-solid fa-dice mr-2"></i> 抽取特徵盲盒</button>
                                    </div>
                                )}
                                {tab !== 'blindBox' && tab !== 'custom' && tab !== 'frames' && (
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                                        {AVATAR_OPTIONS[tab].map(opt => (
                                            <button 
                                                key={opt.id} 
                                                onClick={() => setEditConfig({...editConfig, [tab]: opt.id, customImage: null, customImageStatus: 'none'})}
                                                className={`p-3 rounded border transition flex flex-col items-center justify-center text-sm gap-2 h-20 ${editConfig[tab] === opt.id && editConfig.customImageStatus !== 'approved' && editConfig.customImageStatus !== 'pending' ? 'border-guild-gold bg-guild-gold/20 text-guild-gold font-bold shadow-[0_0_10px_rgba(197,159,68,0.2)]' : 'border-gray-600 bg-guild-panel hover:border-gray-400 text-gray-300'}`}
                                            >
                                                <span className="text-center">{opt.name}</span>
                                                {(tab === 'skinColor' || tab === 'hairColor') && <div className="w-5 h-5 rounded border border-gray-500 shadow-inner" style={{backgroundColor: `#${opt.id}`}}></div>}
                                                {editConfig[tab] === opt.id && editConfig.customImageStatus !== 'approved' && editConfig.customImageStatus !== 'pending' && tab !== 'skinColor' && tab !== 'hairColor' && <i className="fa-solid fa-check text-guild-gold absolute top-2 right-2 opacity-50 text-xs"></i>}
                                            </button>
                                        ))}
                                    </div>
                                )}
                                {tab === 'frames' && (
                                    <div className="space-y-4 max-w-lg mx-auto mt-4">
                                        <p className="text-sm text-yellow-500/80 mb-4 bg-yellow-900/20 p-4 rounded border border-yellow-900/30"><i className="fa-solid fa-circle-info mr-2"></i>外框需透過道具商行花費金幣購買解鎖，解鎖後即可在此永久切換。</p>
                                        {AVATAR_OPTIONS.frames.map(frame => {
                                            const isUnlocked = editConfig.unlockedFrames.includes(frame.id);
                                            const isEquipped = editConfig.frameClass === frame.id;
                                            return (
                                                <button key={frame.id} onClick={() => { if(isUnlocked) setEditConfig({...editConfig, frameClass: frame.id}); }} disabled={!isUnlocked} className={`w-full p-5 rounded border transition flex items-center justify-between text-lg ${isEquipped ? 'border-guild-gold bg-guild-gold/20 text-guild-gold font-bold' : isUnlocked ? 'border-gray-500 hover:border-gray-300 text-gray-300' : 'border-red-900/30 bg-red-900/10 text-gray-600 cursor-not-allowed'}`}>
                                                    <span>{frame.name}</span>
                                                    <div>
                                                        {isEquipped ? <span className="text-guild-gold text-sm"><i className="fa-solid fa-check mr-1"></i>已裝備</span> : isUnlocked ? <span className="text-gray-300 text-sm">點擊裝備</span> : <span className="text-red-500/50 text-sm"><i className="fa-solid fa-lock mr-1"></i>未解鎖</span>}
                                                    </div>
                                                </button>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                            <div className="p-4 border-t border-guild-gold/20 shrink-0 bg-guild-dark">
                                <button onClick={handleSave} className="w-full py-4 bg-gradient-to-r from-guild-gold to-yellow-500 text-guild-dark font-extrabold rounded hover:brightness-110 transition text-xl shadow-lg flex items-center justify-center">
                                    <i className="fa-solid fa-floppy-disk mr-2"></i> 套用新造型
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminPanel = ({ students, onApprove, onReject }) => {
            const pendingStudents = students.filter(s => s.avatar.customImageStatus === 'pending');
            return (
                <div className="max-w-6xl mx-auto animate-fade-in space-y-6">
                    <h2 className="text-3xl font-bold text-guild-gold border-b border-guild-gold/30 pb-2 flex items-center"><i className="fa-solid fa-gavel mr-3"></i> 老師辦公室 - 頭像審核中心</h2>
                    <p className="text-guild-paper/80">以下冒險者申請更換為 Reroll 專屬自訂頭像，請確認圖片符合公會規範後予以批准。</p>
                    {pendingStudents.length === 0 ? (
                        <div className="panel p-16 text-center text-gray-500 border border-dashed border-gray-600"><i className="fa-solid fa-mug-hot text-4xl mb-4 opacity-50"></i><p>目前沒有需要審核的頭像，老師可以休息一下！</p></div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {pendingStudents.map(s => (
                                <div key={s.id} className="panel p-6 flex flex-col items-center relative hover:border-guild-gold/50 transition">
                                    <h3 className="text-xl text-guild-paper font-bold mb-4">{s.name} <span className="text-sm text-gray-500 font-normal ml-2">Lv.{s.level}</span></h3>
                                    <div className="flex gap-8 mb-6">
                                        <div className="flex flex-col items-center opacity-60"><div className="text-xs mb-2 text-gray-400">目前頭像</div><AvatarDisplay student={{...s, avatar: {...s.avatar, customImageStatus: 'none'}}} size="w-24 h-24" showJob={false} previewPending={false} /></div>
                                        <div className="flex flex-col items-center"><div className="text-xs mb-2 text-yellow-400 font-bold animate-pulse">申請上傳</div><AvatarDisplay student={s} size="w-24 h-24" showJob={false} previewPending={true} /></div>
                                    </div>
                                    <div className="flex w-full gap-3 mt-auto">
                                        <button onClick={() => onApprove(s.id)} className="flex-1 py-3 bg-green-800 hover:bg-green-700 text-white font-bold rounded shadow-lg transition flex items-center justify-center"><i className="fa-solid fa-check mr-2"></i> 批准</button>
                                        <button onClick={() => onReject(s.id)} className="flex-1 py-3 bg-red-900 hover:bg-red-800 text-white font-bold rounded shadow-lg transition flex items-center justify-center"><i className="fa-solid fa-xmark mr-2"></i> 駁回</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            )
        };

        const QuestBoard = ({ classId, students, groups, squadBosses, guildBoss, onResult, onSpawnBoss, onBossAttack }) => {
            const [tab, setTab] = useState('normal'); 
            const [aiTopic, setAiTopic] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiData, setAiData] = useState(null); 
            const [aiSelectedOpt, setAiSelectedOpt] = useState(null);
            const [aiResultText, setAiResultText] = useState(null);
            
            const [selectedStudent, setSelectedStudent] = useState('');
            const [selectedGroupId, setSelectedGroupId] = useState('');
            
            const [isSpinningStudent, setIsSpinningStudent] = useState(false);
            const [reelStudents, setReelStudents] = useState([]);
            const [isSpinningMonster, setIsSpinningMonster] = useState(false);
            const [reelMonsters, setReelMonsters] = useState([]);
            const [drawnMonster, setDrawnMonster] = useState(null);
            
            const [combatAnim, setCombatAnim] = useState({ student: '', monster: '' });
            const [vfx, setVfx] = useState({ student: null, monster: null, studentLevel: 1 });
            const [floatingTexts, setFloatingTexts] = useState([]);
            const [isFighting, setIsFighting] = useState(false);
            
            const TOTAL_ITEMS = 20;
            const SPIN_DURATION = 1500;

            const activeStudents = students.filter(s => s.hp > 0 && s.classId === classId);
            const branchGroups = groups.filter(g => g.classId === classId);
            
            let availableStudents = activeStudents;
            if (tab === 'squad' && selectedGroupId) {
                availableStudents = activeStudents.filter(s => s.groupId === parseInt(selectedGroupId));
            }

            const activeBoss = tab === 'squad' ? squadBosses[selectedGroupId] : tab === 'guild' ? guildBoss : drawnMonster;

            const addFloatingText = (text, type, target) => {
                const id = Date.now() + Math.random();
                setFloatingTexts(prev => [...prev, { id, text, type, target }]);
                setTimeout(() => setFloatingTexts(prev => prev.filter(ft => ft.id !== id)), 1200);
            };

            const resetBoard = () => {
                setDrawnMonster(null); setSelectedStudent(''); setReelMonsters([]); setReelStudents([]); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 }); setIsFighting(false); setAiData(null); setAiSelectedOpt(null); setAiResultText(null);
            };

            const spawnBoss = () => {
                setIsSpinningMonster(true);
                setCombatAnim({ student: '', monster: '' });
                const bossList = BOSS_MONSTERS.filter(b => b.type === tab);
                let newMReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newMReel.push(bossList[Math.floor(Math.random() * bossList.length)]);
                setReelMonsters(newMReel);
                
                setTimeout(() => { 
                    setIsSpinningMonster(false); 
                    const selectedBoss = { ...newMReel[TOTAL_ITEMS - 1], currentHp: newMReel[TOTAL_ITEMS - 1].maxHp, contributions: {} };
                    onSpawnBoss(tab, tab === 'squad' ? parseInt(selectedGroupId) : null, selectedBoss);
                }, 3000);
            };

            const handleGenerateAI = async () => {
                if (!aiTopic.trim()) return;
                setIsGenerating(true); setAiData(null); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setAiResultText(null);
                const prompt = `請根據自然科學或相關學科主題「${aiTopic}」出一個單選題，並設計一隻與此主題相關的奇幻魔物。
                請以 JSON 格式回傳，必須嚴格包含以下欄位：
                {
                  "question": "題目內容",
                  "options": ["選項A", "選項B", "選項C", "選項D"],
                  "answerIndex": 0,
                  "explanation": "正確解答的詳解",
                  "monster": {
                     "id": "ai_monster", "name": "魔物名稱", "diff": "AI特製", "exp": 150, "gold": 80, "dmg": 15, "icon": "fa-bug", "color": "text-purple-500"
                  }
                }`;
                try {
                    const payload = { contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } };
                    const res = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    let text = res.candidates?.[0]?.content?.parts?.[0]?.text;
                    text = text.replace(/```json\n?/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(text);
                    setAiData(data); setDrawnMonster(data.monster);
                } catch (error) {
                    console.error(error); 
                    setAiData({ question: "⚠️ 魔法陣受到干擾，召喚失敗了！", options: ["了解"], answerIndex: -1, explanation: "魔法卷軸吟唱失敗，可能是因為剛才的魔力波動太大（網路不穩），請重新輸入主題再次召喚！", monster: null });
                } finally { setIsGenerating(false); }
            };

            const spinStudentOnly = () => {
                if (availableStudents.length === 0) return alert('小隊中沒有存活的冒險者可以出擊！');
                setIsSpinningStudent(true);
                let newSReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newSReel.push(availableStudents[Math.floor(Math.random() * availableStudents.length)]);
                setReelStudents(newSReel);
                setTimeout(() => {
                    setIsSpinningStudent(false);
                    setSelectedStudent(newSReel[TOTAL_ITEMS-1].id.toString());
                }, SPIN_DURATION);
            };

            const handleDrawStudentAndSpin = () => {
                if (activeStudents.length === 0) return alert('目前沒有可指派的冒險者！');
                setIsSpinningStudent(true); setIsSpinningMonster(true); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 });
                let newSReel = []; let newMReel = [];
                const currentSelectedObj = activeStudents.find(s => s.id === parseInt(selectedStudent)) || activeStudents[0];
                for(let i=0; i<TOTAL_ITEMS; i++) {
                    if(i === 0) newSReel.push(currentSelectedObj); else newSReel.push(activeStudents[Math.floor(Math.random() * activeStudents.length)]);
                    newMReel.push(MONSTERS[Math.floor(Math.random() * MONSTERS.length)]);
                }
                setReelStudents(newSReel); setReelMonsters(newMReel);
                setTimeout(() => { setIsSpinningStudent(false); setSelectedStudent(newSReel[TOTAL_ITEMS - 1].id.toString()); }, SPIN_DURATION);
                setTimeout(() => { setIsSpinningMonster(false); setDrawnMonster(newMReel[TOTAL_ITEMS - 1]); }, 3000);
            };

            const startSpin = () => {
                if (!selectedStudent) return alert('請先選擇接受任務的冒險者！');
                setIsSpinningMonster(true); setDrawnMonster(null); setCombatAnim({ student: '', monster: '' }); setVfx({ student: null, monster: null, studentLevel: 1 });
                let newMReel = [];
                for(let i=0; i<TOTAL_ITEMS; i++) newMReel.push(MONSTERS[Math.floor(Math.random() * MONSTERS.length)]);
                setReelMonsters(newMReel);
                setTimeout(() => { setIsSpinningMonster(false); setDrawnMonster(newMReel[TOTAL_ITEMS - 1]); }, 3000);
            };

            const executeFight = (isCorrect) => {
                if (!selectedStudent || !activeBoss || isFighting) return;
                setIsFighting(true);
                const student = activeStudents.find(s => s.id === parseInt(selectedStudent));
                const jobType = student.job === '戰士' ? 'warrior' : student.job === '法師' ? 'mage' : student.job === '遊俠' ? 'ranger' : student.job === '刺客' ? 'assassin' : student.job === '牧師' ? 'cleric' : 'novice';
                const synergy = getGroupSynergy(student.groupId, students);
                
                // ★ 讀取專屬武器的數值加成
                const weaponStats = student.equipment?.stats || {};
                const weaponAtk = weaponStats.atkBase || 0;
                const weaponExp = weaponStats.expMult || 0;
                const weaponGold = weaponStats.goldMult || 0;
                const weaponDodge = weaponStats.dodgeBonus || 0;
                const weaponDef = weaponStats.defBonus || 0;
                const weaponHeal = weaponStats.healBonus || 0;

                const isBossBattle = tab === 'squad' || tab === 'guild';

                let finalExp = isBossBattle ? 0 : activeBoss.exp;
                let finalGold = isBossBattle ? 0 : activeBoss.gold;
                let finalDmg = activeBoss.dmg;
                let damageDealtToBoss = 0;
                let isDodged = false;
                let healAmt = (synergy.active ? synergy.healAmount : 0) + (student.job === '牧師' ? 5 : 0) + weaponHeal;

                if (isCorrect) {
                    if (isBossBattle) {
                        // 武器提供大量基礎攻擊力，再依據職業與羈絆進行乘算
                        let baseAtk = 20 + (student.level * 10) + weaponAtk;
                        let jobMult = student.job === '法師' ? 1.2 : (student.job === '遊俠' ? 1.03 : 1.0);
                        let synMult = (synergy.active && synergy.expGoldMult > 1) ? synergy.expGoldMult : 1.0;
                        damageDealtToBoss = Math.floor(baseAtk * jobMult * synMult * (0.9 + Math.random() * 0.2));
                    } else {
                        // 武器提供的額外 EXP 與 Gold 倍率
                        let expMult = 1 + weaponExp;
                        let goldMult = 1 + weaponGold;
                        if (student.job === '法師') expMult += 0.1;
                        if (student.job === '遊俠') { expMult += 0.03; goldMult += 0.03; }
                        if (synergy.active && synergy.expGoldMult > 1) {
                            expMult *= synergy.expGoldMult;
                            goldMult *= synergy.expGoldMult;
                        }
                        finalExp = Math.floor(finalExp * expMult);
                        finalGold = Math.floor(finalGold * goldMult);
                    }

                    setCombatAnim({ student: 'anim-attack-right', monster: '' });
                    setTimeout(() => {
                        setVfx({ student: null, monster: jobType, studentLevel: student.level }); 
                        setCombatAnim({ student: '', monster: 'anim-shake-red' }); 
                        addFloatingText(isBossBattle ? `⚔️ ${damageDealtToBoss} 傷!` : '⚔️ 爆擊!', 'damage', 'monster');
                        
                        setTimeout(() => {
                            setVfx({ student: null, monster: null, studentLevel: 1 }); 
                            setCombatAnim({ student: '', monster: 'anim-fade-out' });
                            
                            if (!isBossBattle) {
                                addFloatingText(`+${finalExp} EXP`, 'exp', 'student');
                                setTimeout(() => addFloatingText(`+${finalGold} G`, 'gold', 'student'), 300);
                            }
                            if (healAmt > 0) setTimeout(() => addFloatingText(`+${healAmt} HP`, 'heal', 'student'), 600);

                            setTimeout(() => { 
                                if (isBossBattle) {
                                    onBossAttack(student.id, tab, selectedGroupId, damageDealtToBoss, 0, 0, false, activeBoss.id);
                                } else {
                                    onResult(parseInt(selectedStudent), activeBoss, true, { finalExp, finalGold, finalDmg: 0, healAmt, isDodged: false }); 
                                    resetBoard(); 
                                }
                                setIsFighting(false);
                                if(isBossBattle) {
                                    setCombatAnim({ student: '', monster: '' });
                                    setSelectedStudent('');
                                }
                            }, 1000);
                        }, 700);
                    }, 300);
                } else {
                    // 刺客基礎閃避加上武器提供的額外閃避機率
                    let myDodge = (student.job === '刺客' ? 0.20 : 0) + weaponDodge;
                    if (Math.random() < myDodge) isDodged = true;
                    // 小隊羈絆賦予的額外閃避判定
                    if (!isDodged && synergy.active && synergy.dodgeChance > 0 && Math.random() < synergy.dodgeChance) isDodged = true;

                    if (isDodged) finalDmg = 0;
                    else {
                        // 戰士基礎防禦加上武器防禦加成
                        let myDef = (student.job === '戰士' ? 5 : 0) + weaponDef;
                        if (synergy.active && synergy.dmgRed > 0) myDef += synergy.dmgRed;
                        finalDmg = Math.max(1, finalDmg - myDef);
                    }

                    setCombatAnim({ student: '', monster: 'anim-attack-left' });
                    setTimeout(() => {
                        setVfx({ student: 'monster', monster: null, studentLevel: 1 });
                        if (!isDodged) setCombatAnim({ student: 'anim-shake-red', monster: '' });
                        
                        if (isDodged) addFloatingText('💨 閃避!', 'heal', 'student');
                        else addFloatingText(`-${finalDmg} HP`, 'damage', 'student');
                        
                        if (healAmt > 0) setTimeout(() => addFloatingText(`+${healAmt} HP`, 'heal', 'student'), 600);

                        setTimeout(() => { 
                            setVfx({ student: null, monster: null, studentLevel: 1 }); 
                            if (isBossBattle) {
                                onBossAttack(student.id, tab, selectedGroupId, 0, finalDmg, 0, isDodged, activeBoss.id);
                            } else {
                                onResult(parseInt(selectedStudent), activeBoss, false, { finalExp: 0, finalGold: 0, finalDmg, healAmt, isDodged }); 
                                resetBoard(); 
                            }
                            setIsFighting(false);
                            if(isBossBattle) {
                                setCombatAnim({ student: '', monster: '' });
                                setSelectedStudent('');
                            }
                        }, 1200);
                    }, 300);
                }
            };

            const handleAiAnswer = (index) => {
                if (aiSelectedOpt !== null) return;
                setAiSelectedOpt(index);
                const isCorrect = index === aiData.answerIndex;
                if (isCorrect) setAiResultText("✨ 答對了！魔物被重創！"); else setAiResultText("❌ 答錯了！遭到了魔物的反擊！");
                setTimeout(() => { executeFight(isCorrect); }, 1500);
            };

            return (
                <div className="max-w-5xl mx-auto animate-fade-in">
                    <div className="flex justify-between items-end border-b border-guild-gold/30 pb-2 mb-6">
                        <h2 className="text-3xl font-bold text-guild-gold">任務看板</h2>
                        <div className="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                            <button onClick={() => { setTab('normal'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'normal' ? 'bg-guild-gold text-guild-dark' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-slot-machine mr-2"></i>一般遭遇</button>
                            <button onClick={() => { setTab('ai'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'ai' ? 'bg-purple-600 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-scroll mr-2"></i>AI 魔法卷軸</button>
                            <button onClick={() => { setTab('squad'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'squad' ? 'bg-blue-600 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-dungeon mr-2"></i>小隊迷宮戰</button>
                            <button onClick={() => { setTab('guild'); resetBoard(); }} className={`px-4 py-2 rounded-t font-bold transition whitespace-nowrap ${tab === 'guild' ? 'bg-red-700 text-white' : 'bg-guild-dark text-gray-400 hover:text-white border border-gray-600 border-b-0'}`}><i className="fa-solid fa-globe mr-2"></i>全公會討伐</button>
                        </div>
                    </div>
                    
                    <div className={`panel p-6 md:p-10 text-center relative overflow-hidden bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] ${tab === 'ai' ? 'from-purple-900/40 via-guild-dark to-black' : tab === 'squad' ? 'from-blue-900/30 via-guild-dark to-black' : tab === 'guild' ? 'from-red-900/30 via-guild-dark to-black' : 'from-guild-panel via-guild-dark to-black'}`}>
                        
                        {tab === 'squad' && (
                            <div className="mb-6 max-w-sm mx-auto">
                                <select className="w-full p-3 bg-guild-dark border border-blue-500 rounded text-blue-200 font-bold focus:outline-none shadow-[0_0_15px_rgba(59,130,246,0.3)]" value={selectedGroupId} onChange={e => {setSelectedGroupId(e.target.value); setSelectedStudent('');}}>
                                    <option value="">-- 請先選擇進入迷宮的小隊 --</option>
                                    {branchGroups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                </select>
                            </div>
                        )}

                        <div className="mb-8 max-w-lg mx-auto text-left relative z-10 bg-black/40 p-4 rounded-xl border border-guild-gold/20">
                            <label className="block text-guild-paper mb-2 font-bold text-center"><i className="fa-solid fa-hand-pointer mr-2"></i>指派冒險者</label>
                            <div className="flex gap-2">
                                <select className="flex-1 p-4 bg-guild-dark border-2 border-guild-gold rounded-lg text-guild-gold font-bold text-lg focus:outline-none shadow-[0_0_15px_rgba(197,159,68,0.3)]" value={selectedStudent} onChange={(e) => setSelectedStudent(e.target.value)} disabled={isSpinningStudent || isSpinningMonster || isFighting || isGenerating || (tab === 'squad' && !selectedGroupId)}>
                                    <option value="">-- 手動點名 --</option>
                                    {availableStudents.map(s => <option key={s.id} value={s.id}>{s.name} (Lv.{s.level} {s.job}) - HP: {s.hp}</option>)}
                                </select>
                                {tab === 'normal' && <button onClick={handleDrawStudentAndSpin} disabled={isSpinningStudent || isSpinningMonster || isFighting || availableStudents.length === 0} className="px-6 bg-blue-800 hover:bg-blue-700 disabled:bg-gray-700 text-white font-bold rounded-lg border border-blue-500 transition shadow-[0_0_15px_rgba(30,64,175,0.5)] flex items-center justify-center whitespace-nowrap"><i className={`fa-solid fa-dice ${isSpinningStudent || isSpinningMonster ? 'fa-spin' : ''} mr-2 text-2xl`}></i> 一鍵雙抽</button>}
                            </div>
                            
                            {(tab === 'squad' || tab === 'guild') && activeBoss && !isSpinningStudent && !isFighting && (
                                <div className="mt-4 text-center">
                                    <button onClick={spinStudentOnly} disabled={availableStudents.length===0} className="px-6 py-2 bg-indigo-700 hover:bg-indigo-600 disabled:bg-gray-700 text-white font-bold rounded shadow transition"><i className="fa-solid fa-user-ninja mr-2"></i> 隨機指派出擊</button>
                                </div>
                            )}
                        </div>

                        <div className="flex flex-col md:flex-row justify-center items-start gap-12 mb-8 mt-4">
                            <div className={`relative flex flex-col items-center w-56 ${combatAnim.student}`}>
                                <VFXOverlay type={vfx.student} level={vfx.studentLevel} />
                                {floatingTexts.filter(ft => ft.target === 'student').map(ft => (
                                    <div key={ft.id} className={`absolute -top-10 font-bold text-3xl z-[60] anim-float-up pointer-events-none drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] ${ft.type === 'damage' ? 'text-red-500' : ft.type === 'exp' ? 'text-blue-400' : ft.type === 'gold' ? 'text-yellow-400' : 'text-green-400'}`}>{ft.text}</div>
                                ))}
                                
                                <div className={`w-40 h-40 rounded-lg border-4 ${isSpinningStudent || selectedStudent ? 'border-blue-400 shadow-[0_0_20px_rgba(96,165,250,0.5)]' : 'border-gray-700'} bg-black overflow-hidden relative z-10`}>
                                    {(!isSpinningStudent && !selectedStudent) ? (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center opacity-80 shadow-inner"><i className="fa-solid fa-user text-6xl text-gray-600 animate-pulse"></i></div>
                                    ) : (
                                        <>
                                            <div className="absolute inset-0 pointer-events-none z-10 shadow-[inset_0_20px_20px_rgba(0,0,0,0.8),inset_0_-20px_20px_rgba(0,0,0,0.8)]"></div>
                                            <div className={`flex flex-col w-full ${isSpinningStudent ? 'spin-reel-student' : ''}`}>
                                                {isSpinningStudent ? (
                                                    reelStudents.map((s, i) => (
                                                        <div key={i} className="w-full h-40 flex items-center justify-center shrink-0"><AvatarDisplay student={s} size="w-32 h-32" /></div>
                                                    ))
                                                ) : (
                                                    <div className="w-full h-40 flex items-center justify-center shrink-0"><AvatarDisplay student={availableStudents.find(s => s.id === parseInt(selectedStudent))} size="w-32 h-32" /></div>
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                <div className="h-12 mt-5 flex items-center justify-center w-full relative z-20">
                                    {isSpinningStudent ? (
                                        <div className="text-gray-400 font-bold animate-pulse tracking-widest text-sm">搜尋冒險者...</div>
                                    ) : selectedStudent ? (
                                        <div className="font-bold text-xl text-guild-paper bg-guild-dark px-6 py-2 rounded-full border-2 border-blue-400 shadow-[0_0_15px_rgba(96,165,250,0.4)] whitespace-nowrap">
                                            {availableStudents.find(s => s.id === parseInt(selectedStudent))?.name} 
                                            <span className="text-sm text-gray-400 ml-2">Lv.{availableStudents.find(s => s.id === parseInt(selectedStudent))?.level}</span>
                                        </div>
                                    ) : <div className="text-gray-600 font-bold text-sm">等待指派</div>}
                                </div>
                            </div>
                            
                            <div className="text-5xl text-guild-gold font-bold italic drop-shadow-[0_0_10px_rgba(250,204,21,0.8)] z-10 mx-2 self-center pt-16">VS</div>

                            <div className={`relative flex flex-col items-center w-64 ${combatAnim.monster}`}>
                                <VFXOverlay type={vfx.monster} level={vfx.studentLevel} />
                                {floatingTexts.filter(ft => ft.target === 'monster').map(ft => (
                                    <div key={ft.id} className="absolute -top-10 text-center font-black text-4xl text-red-500 z-[60] anim-float-up pointer-events-none drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">{ft.text}</div>
                                ))}
                                
                                <div className={`w-40 h-40 rounded-lg border-4 ${isSpinningMonster || activeBoss ? (tab === 'ai' ? 'border-purple-500 shadow-[0_0_20px_rgba(168,85,247,0.8)]' : tab === 'guild' ? 'border-red-600 shadow-[0_0_30px_rgba(220,38,38,0.8)]' : 'border-red-400 shadow-[0_0_20px_rgba(248,113,113,0.5)]') : 'border-gray-700'} bg-black overflow-hidden relative z-10 self-center`}>
                                    {(!isSpinningMonster && !activeBoss) ? (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center opacity-80 shadow-inner">
                                            {(tab === 'squad' && selectedGroupId) ? (
                                                <button onClick={spawnBoss} className="px-4 py-2 bg-purple-700 hover:bg-purple-600 font-bold rounded shadow text-white text-sm whitespace-nowrap animate-pulse">探索新迷宮</button>
                                            ) : (tab === 'guild') ? (
                                                <button onClick={spawnBoss} className="px-4 py-2 bg-red-800 hover:bg-red-700 font-bold rounded shadow text-white text-sm whitespace-nowrap animate-pulse">召喚世界首領</button>
                                            ) : (
                                                <>
                                                    {isGenerating ? <i className="fa-solid fa-hurricane fa-spin text-6xl text-purple-500"></i> : <i className="fa-solid fa-question text-6xl text-gray-600 animate-pulse"></i>}
                                                </>
                                            )}
                                        </div>
                                    ) : (
                                        <>
                                            <div className="absolute inset-0 pointer-events-none z-10 shadow-[inset_0_20px_20px_rgba(0,0,0,0.8),inset_0_-20px_20px_rgba(0,0,0,0.8)]"></div>
                                            <div className={`flex flex-col w-full ${isSpinningMonster ? 'spin-reel-monster' : ''}`}>
                                                {isSpinningMonster ? (
                                                    reelMonsters.map((m, i) => <div key={i} className="w-full h-40 flex items-center justify-center shrink-0"><MonsterDisplay monster={m} isSpinning={true} /></div>)
                                                ) : (
                                                    <div className="w-full h-40 flex items-center justify-center shrink-0"><MonsterDisplay monster={activeBoss} /></div>
                                                )}
                                            </div>
                                        </>
                                    )}
                                </div>
                                
                                <div className="h-12 mt-5 flex flex-col items-center justify-center w-full relative z-20">
                                    {isSpinningMonster ? (
                                        <div className="text-gray-400 font-bold animate-pulse tracking-widest text-sm">探索魔物中...</div>
                                    ) : activeBoss ? (
                                        <div className={`font-bold text-xl text-white ${tab === 'ai' ? 'bg-purple-900/80 border-purple-500 shadow-[0_0_15px_rgba(168,85,247,0.4)]' : tab === 'guild' ? 'bg-red-950/90 border-red-600 shadow-[0_0_20px_rgba(220,38,38,0.5)]' : 'bg-red-900/80 border-red-400 shadow-[0_0_15px_rgba(248,113,113,0.4)]'} px-6 py-2 rounded-full border-2 whitespace-nowrap`}>
                                            {activeBoss.name} <span className="text-xs text-red-300 ml-1">({activeBoss.diff})</span>
                                        </div>
                                    ) : isGenerating ? (
                                        <div className="text-purple-400 font-bold animate-pulse tracking-widest text-sm">煉成中...</div>
                                    ) : <div className="text-gray-600 font-bold text-sm">等待探索</div>}
                                </div>

                                {/* 魔王戰專屬的血量條與貢獻榜 */}
                                {(tab === 'squad' || tab === 'guild') && activeBoss && !isSpinningMonster && (
                                    <div className="w-full px-2 mt-2 animate-fade-in">
                                        <div className="flex justify-between text-xs text-red-200 mb-1 font-bold">
                                            <span><i className="fa-solid fa-heart mr-1"></i>魔王血量</span>
                                            <span>{activeBoss.currentHp} / {activeBoss.maxHp}</span>
                                        </div>
                                        <div className="w-full h-4 bg-red-950 rounded-full overflow-hidden border border-red-900/50 shadow-inner">
                                            <div className="h-full bg-gradient-to-r from-red-600 to-red-400 transition-all duration-500" style={{ width: `${(activeBoss.currentHp / activeBoss.maxHp) * 100}%` }}></div>
                                        </div>
                                        
                                        <div className="mt-3 bg-black/60 p-3 rounded-lg border border-gray-700 h-32 overflow-y-auto custom-scrollbar">
                                            <div className="text-yellow-500 font-bold border-b border-gray-700 mb-2 pb-1 text-sm text-left"><i className="fa-solid fa-ranking-star mr-1"></i> 傷害貢獻榜</div>
                                            {Object.keys(activeBoss.contributions || {}).length === 0 ? (
                                                <div className="text-xs text-gray-500">尚無人發動攻擊</div>
                                            ) : (
                                                Object.entries(activeBoss.contributions).sort((a,b)=>b[1]-a[1]).map(([id, dmg], idx) => (
                                                    <div key={id} className="flex justify-between items-center text-xs mb-1">
                                                        <span className="text-gray-300 truncate">
                                                            {idx===0 ? <i className="fa-solid fa-crown text-yellow-400 mr-1"></i> : idx===1 ? <i className="fa-solid fa-medal text-gray-300 mr-1"></i> : idx===2 ? <i className="fa-solid fa-medal text-yellow-700 mr-1"></i> : null}
                                                            {students.find(s=>s.id==id)?.name || '未知'}
                                                        </span>
                                                        <span className="text-red-400 font-bold whitespace-nowrap">{dmg} 傷</span>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="min-h-32 mt-6">
                            {tab === 'normal' && (!activeBoss && !isSpinningStudent && !isSpinningMonster) && (
                                <button onClick={startSpin} disabled={!selectedStudent || isFighting} className="px-10 py-5 bg-gradient-to-b from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 text-black disabled:from-gray-700 disabled:to-gray-800 disabled:text-gray-500 font-extrabold rounded-full shadow-[0_5px_0_#b45309,0_10px_20px_rgba(0,0,0,0.5)] active:shadow-[0_0px_0_#b45309,0_0px_0px_rgba(0,0,0,0.5)] active:translate-y-[5px] transition-all text-2xl">
                                    <i className="fa-solid fa-gamepad mr-2"></i> 開始探索！
                                </button>
                            )}

                            {tab === 'ai' && !activeBoss && !isGenerating && (
                                <div className="flex flex-col items-center gap-4 max-w-lg mx-auto bg-purple-900/30 p-6 rounded-xl border border-purple-500/50 shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                                    <div className="text-purple-300 font-bold"><i className="fa-solid fa-wand-magic-sparkles mr-2"></i>請輸入魔法卷軸主題，喚醒相關的魔物與考驗！</div>
                                    <div className="flex w-full gap-2">
                                        <input type="text" placeholder="例如：細胞分裂、牛頓運動定律..." value={aiTopic} onChange={e => setAiTopic(e.target.value)} className="flex-1 p-4 bg-black/50 border border-purple-500/50 text-white rounded focus:outline-none focus:border-purple-400" />
                                        <button onClick={handleGenerateAI} disabled={!selectedStudent || !aiTopic} className="px-6 bg-purple-600 hover:bg-purple-500 disabled:bg-gray-700 text-white font-bold rounded shadow-lg transition whitespace-nowrap">吟唱召喚</button>
                                    </div>
                                    {!selectedStudent && <div className="text-red-400 text-sm">請先在上方指派挑戰的冒險者！</div>}
                                </div>
                            )}

                            {(isSpinningStudent || isSpinningMonster || isGenerating) && (
                                <div className={`text-2xl font-bold animate-pulse mt-4 ${isGenerating ? 'text-purple-400' : 'text-yellow-500'}`}>
                                    {isGenerating ? <><i className="fa-solid fa-hurricane fa-spin mr-2"></i> 魔法元素煉成中...</> : <><i className="fa-solid fa-spinner fa-spin mr-2"></i> 命運轉盤轉動中...</>}
                                </div>
                            )}

                            {/* 一般與魔王共通的戰鬥按鈕 */}
                            {activeBoss && !isFighting && !isSpinningMonster && !isSpinningStudent && tab !== 'ai' && (
                                <div className="animate-fade-in">
                                    <div className="text-base text-gray-300 mb-6 bg-guild-dark inline-block px-6 py-3 rounded-full border border-guild-gold shadow-lg">
