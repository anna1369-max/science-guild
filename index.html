                                                <button onClick={() => onBuy(buyer.id, item)} disabled={disabled} className={`mt-auto w-full py-2 rounded font-bold transition flex items-center justify-center gap-2 z-10 ${disabled ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : (item.id.includes('w2_') ? 'bg-blue-700 text-white hover:bg-blue-600 shadow-[0_0_10px_rgba(59,130,246,0.5)]' : 'bg-guild-gold text-guild-dark hover:bg-yellow-400 hover:scale-[1.02]')}`}>
                                                    {isWrongJob ? <><i className="fa-solid fa-ban"></i> 職業不符</> : !canAfford ? <><i className="fa-solid fa-lock"></i> 金幣不足</> : <><i className="fa-solid fa-khanda"></i> 裝備</>}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <h3 className="text-lg font-bold text-yellow-500 mb-3 flex items-center"><i className="fa-solid fa-crown mr-2"></i>尊爵頭像外框 (解鎖永久擁有)</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {SHOP_ITEMS.filter(item => item.type === 'frame').map(item => {
                                        const canAfford = buyer.gold >= item.cost;
                                        const isOwned = buyer.avatar.unlockedFrames.includes(item.value);
                                        const disabled = !canAfford || isOwned;
                                        return (
                                            <div key={item.id} className="panel p-4 flex flex-col bg-guild-dark border border-yellow-700/50 relative overflow-hidden">
                                                <div className="flex justify-between items-start mb-2 z-10"><h4 className="font-bold text-lg text-yellow-500">{item.name}</h4><span className="text-guild-gold font-bold bg-yellow-900/30 px-2 py-1 rounded text-sm"><i className="fa-solid fa-coins mr-1"></i>{item.cost}</span></div>
                                                <p className="text-xs text-yellow-200/60 mb-4 flex-grow z-10">{item.desc}</p>
                                                <button onClick={() => onBuy(buyer.id, item)} disabled={disabled} className={`mt-auto w-full py-2 rounded font-bold transition flex items-center justify-center gap-2 z-10 ${isOwned ? 'bg-green-900/50 text-green-400 border border-green-600 cursor-not-allowed' : disabled ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-yellow-600 text-white hover:bg-yellow-500 shadow-[0_0_10px_rgba(202,138,4,0.5)]'}`}>
                                                    {isOwned ? <><i className="fa-solid fa-check"></i> 已解鎖</> : !canAfford ? <><i className="fa-solid fa-lock"></i> 金幣不足</> : <><i className="fa-solid fa-unlock"></i> 解鎖外觀</>}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentClassId, setCurrentClassId] = useState(null); 
            const [view, setView] = useState('dashboard'); 
            const [loginMode, setLoginMode] = useState(null); // 'teacher' 或 'student'
            const [loggedInStudentId, setLoggedInStudentId] = useState(null);

            const [classes, setClasses] = useState([]);
            const [students, setStudents] = useState([]);
            const [groups, setGroups] = useState([]);
            const [logs, setLogs] = useState([]); 
            const [showJobModal, setShowJobModal] = useState(null); 
            const [shopBuyerId, setShopBuyerId] = useState(null); 
            const [editingAvatarId, setEditingAvatarId] = useState(null);
            
            const [squadBosses, setSquadBosses] = useState({});
            const [guildBoss, setGuildBoss] = useState(null);
            const [ruleItems, setRuleItems] = useState([]);
            
            // 雲端連線狀態與阻斷機制
            const [user, setUser] = useState(null);
            const [isCloudLoaded, setIsCloudLoaded] = useState(false);
            const [cloudError, setCloudError] = useState('');
            const isRemoteUpdate = useRef(false);

            // 將條件渲染前的所有 hooks 提升至頂層
            const [selClass, setSelClass] = useState('');
            const [selStudent, setSelStudent] = useState('');
            const [inputPin, setInputPin] = useState('');
            
            const [isChangingPin, setIsChangingPin] = useState(false);
            const [newPinStr, setNewPinStr] = useState('');

            // 初始化 Firebase 模組
            useEffect(() => {
                let unsubscribe;
                const initFirebase = async () => {
                    try {
                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        const userFirebaseConfig = {
                            apiKey: "AIzaSyDQK2SfKcC0VoI9XV_W2ScUAVRaX9PU9AM",
                            authDomain: "science-guild.firebaseapp.com",
                            projectId: "science-guild",
                            storageBucket: "science-guild.firebasestorage.app",
                            messagingSenderId: "947533162231",
                            appId: "1:947533162231:web:2c372a85035b89998415f2"
                        };
                        
                        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : userFirebaseConfig;
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        
                        window.db = getFirestore(app);
                        window.setDoc = setDoc;
                        window.doc = doc;
                        window.onSnapshot = onSnapshot;

                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                    } catch(e) {
                        console.error("Firebase 連線初始化失敗，請檢查網路狀態", e);
                        if (e.code === 'auth/operation-not-allowed') {
                            setCloudError('【認證失敗】您尚未在 Firebase Authentication 中開啟「匿名登入 (Anonymous)」！');
                        } else {
                            setCloudError(`【連線失敗】無法連接 Firebase: ${e.message}`);
                        }
                        setIsCloudLoaded(true);
                    }
                };
                initFirebase();
                
                // 註冊重置密碼事件監聽器
                const handleResetEvent = (e) => {
                    let updated = [...students];
                    let sIndex = updated.findIndex(s => s.id === parseInt(e.detail));
                    if(sIndex !== -1) {
                        updated[sIndex].pin = '0000';
                        setStudents(updated);
                        addLog(`🔑 教師已重置 ${updated[sIndex].name} 的登入密碼為 0000。`, updated[sIndex].classId);
                        alert('密碼已成功重置為 0000');
                    }
                };
                window.addEventListener('reset-pin', handleResetEvent);

                return () => { 
                    if (unsubscribe) unsubscribe(); 
                    window.removeEventListener('reset-pin', handleResetEvent);
                };
            }, [students]);

            // 讀取遠端資料
            useEffect(() => {
                if (!user || !window.db) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'science-guild';
                const stateRef = window.doc(window.db, 'artifacts', appId, 'public', 'data', 'guildData', 'mainState');
                
                const unsubscribeData = window.onSnapshot(stateRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        isRemoteUpdate.current = true; // 阻斷接下來的本地寫回迴圈
                        setClasses(data.classes || []);
                        
                        let parsedStudents = data.students || [];
                        parsedStudents = parsedStudents.map(s => {
                            let av = s.avatar || {};
                            return {
                                ...s, 
                                pin: s.pin || '0000', 
                                avatar: {
                                    seed: av.seed || s.name,
                                    skinColor: AVATAR_OPTIONS.skinColor.some(o => o.id === av.skinColor) ? av.skinColor : 'f2d3b1',
                                    hairColor: AVATAR_OPTIONS.hairColor.some(o => o.id === av.hairColor) ? av.hairColor : '111111',
                                    head: AVATAR_OPTIONS.head.some(o => o.id === av.head) ? av.head : 'variant01', 
                                    hair: AVATAR_OPTIONS.hair.some(o => o.id === av.hair) ? av.hair : 'variant01',
                                    eyes: AVATAR_OPTIONS.eyes.some(o => o.id === av.eyes) ? av.eyes : 'variant01',
                                    eyebrows: AVATAR_OPTIONS.eyebrows.some(o => o.id === av.eyebrows) ? av.eyebrows : 'variant01',
                                    mouth: AVATAR_OPTIONS.mouth.some(o => o.id === av.mouth) ? av.mouth : 'happy01',
                                    glasses: AVATAR_OPTIONS.glasses.some(o => o.id === av.glasses) ? av.glasses : 'none',
                                    freckles: AVATAR_OPTIONS.freckles.some(o => o.id === av.freckles) ? av.freckles : '0',
                                    frameClass: av.frameClass || 'border-gray-500',
                                    unlockedFrames: av.unlockedFrames || ['border-gray-500'],
                                    customImage: av.customImage || null,
                                    customImageStatus: av.customImageStatus || 'none'
                                }
                            };
                        });
                        setStudents(parsedStudents);
                        setGroups(data.groups || []);
                        setLogs(data.logs || []);
                        setSquadBosses(data.squadBosses || {});
                        setGuildBoss(data.guildBoss || null);
                        
                        // 相容舊版扣分資料轉換為新版獎懲系統
                        let loadedRules = data.ruleItems || data.penaltyItems;
                        if (!loadedRules || loadedRules.length === 0) loadedRules = INITIAL_RULE_ITEMS;
                        loadedRules = loadedRules.map(r => ({...r, type: r.type || 'penalty', exp: r.exp || r.points || 0, gold: r.gold || 0}));
                        setRuleItems(loadedRules);
                        
                        setCloudError(''); 
                        
                    } else {
                        console.log("雲端尚無存檔，準備將本地資料上傳同步...");
                    }
                    setIsCloudLoaded(true);
                }, (error) => {
                    console.error("Firebase 同步錯誤:", error);
                    if (error.code === 'permission-denied') {
                        setCloudError('【權限遭拒】請至 Firestore Database 修改「規則 (Rules)」設定允許讀寫。');
                    } else {
                        setCloudError(`【同步失敗】資料庫連線異常: ${error.message}`);
                    }
                    setIsCloudLoaded(true);
                });
                return () => unsubscribeData();
            }, [user]);

            // 存取本地暫存
            useEffect(() => {
                const savedClasses = localStorage.getItem('guild_classes');
                const savedStudents = localStorage.getItem('guild_students');
                const savedGroups = localStorage.getItem('guild_groups');
                const savedLogs = localStorage.getItem('guild_logs');
                const savedSquadBosses = localStorage.getItem('guild_squad_bosses');
                const savedGuildBoss = localStorage.getItem('guild_guild_boss');
                const savedRuleItems = localStorage.getItem('guild_rule_items') || localStorage.getItem('guild_penalty_items');
                
                if (savedClasses && savedStudents && savedGroups) {
                    setClasses(JSON.parse(savedClasses));
                    setStudents(JSON.parse(savedStudents));
                    setGroups(JSON.parse(savedGroups));
                    if (savedLogs) setLogs(JSON.parse(savedLogs));
                    if (savedSquadBosses) setSquadBosses(JSON.parse(savedSquadBosses));
                    if (savedGuildBoss) setGuildBoss(JSON.parse(savedGuildBoss));
                    if (savedRuleItems) {
                        let parsed = JSON.parse(savedRuleItems);
                        parsed = parsed.map(r => ({...r, type: r.type || 'penalty', exp: r.exp || r.points || 0, gold: r.gold || 0}));
                        setRuleItems(parsed);
                    }
                } else {
                    setClasses(INITIAL_CLASSES);
                    setStudents(INITIAL_STUDENTS);
                    setGroups(INITIAL_GROUPS);
                    setRuleItems(INITIAL_RULE_ITEMS);
                }
            }, []);

            // 本地資料改變時，同步寫入遠端與本地端
            useEffect(() => {
                if (classes.length > 0) {
                    localStorage.setItem('guild_classes', JSON.stringify(classes));
                    localStorage.setItem('guild_students', JSON.stringify(students));
                    localStorage.setItem('guild_groups', JSON.stringify(groups));
                    localStorage.setItem('guild_logs', JSON.stringify(logs));
                    localStorage.setItem('guild_squad_bosses', JSON.stringify(squadBosses));
                    localStorage.setItem('guild_guild_boss', JSON.stringify(guildBoss));
                    localStorage.setItem('guild_rule_items', JSON.stringify(ruleItems));
                }

                if (!isCloudLoaded || !user || !window.db) return;
                
                // 阻斷無限迴圈
                if (isRemoteUpdate.current) {
                    isRemoteUpdate.current = false;
                    return;
                }
                
                const payload = { classes, students, groups, logs, squadBosses, guildBoss, ruleItems };
                const cleanPayload = JSON.parse(JSON.stringify(payload));
                
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'science-guild';
                const stateRef = window.doc(window.db, 'artifacts', appId, 'public', 'data', 'guildData', 'mainState');
                
                window.setDoc(stateRef, cleanPayload).catch(e => {
                    console.error("Save error", e);
                    if (e.code === 'permission-denied') {
                        setCloudError('【存檔被拒絕】請至 Firestore Database 修改「規則 (Rules)」設定允許讀寫。');
                    } else {
                        setCloudError(`【存檔失敗】${e.message}`);
                    }
                });
                
            }, [classes, students, groups, logs, squadBosses, guildBoss, ruleItems, isCloudLoaded, user]);

            const addLog = (msg, targetClassId = currentClassId) => {
                const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
                setLogs(prev => [{time, msg, classId: targetClassId}, ...prev].slice(0, 100));
            };

            const getExpReq = (level) => level * 100;

            const handleSpawnBoss = (type, groupId, bossObj) => {
                if (type === 'squad') {
                    setSquadBosses(prev => ({ ...prev, [groupId]: bossObj }));
                    addLog(`⚠️ 迷宮震動... 【${getGroup(groupId)?.name}】遭遇了迷宮魔王 ${bossObj.name}！`, getClassObj(currentClassId)?.id);
                } else {
                    setGuildBoss(bossObj);
                    addLog(`🚨 空間裂縫開啟！世界首領 ${bossObj.name} 降臨公會大廳！`, null);
                }
            };

            const distributeBossRewards = (bossData, currentStudents, currentGroups) => {
                let updatedStudents = [...currentStudents];
                let updatedGroups = [...currentGroups];
                
                Object.entries(bossData.contributions).forEach(([cIdStr, cDmg]) => {
                    const cId = parseInt(cIdStr);
                    const ratio = cDmg / bossData.maxHp;
                    const rewardExp = Math.max(1, Math.floor(bossData.exp * ratio));
                    const rewardGold = Math.max(1, Math.floor(bossData.gold * ratio));
                    
                    let sIdx = updatedStudents.findIndex(s => s.id === cId);
                    if (sIdx !== -1) {
                        let s = { ...updatedStudents[sIdx] };
                        s.exp += rewardExp;
                        s.gold += rewardGold;
                        
                        let gIdx = updatedGroups.findIndex(g => g.id === s.groupId);
                        if (gIdx !== -1) updatedGroups[gIdx].score += rewardExp;
                        
                        // 升級檢查
                        let reqExp = getExpReq(s.level);
                        while (s.exp >= reqExp) {
                            s.exp -= reqExp;
                            s.level += 1;
                            s.maxHp += 5;
                            const synergy = getGroupSynergy(s.groupId, updatedStudents);
                            s.hp = s.maxHp + synergy.hpBonus; 
                            reqExp = getExpReq(s.level);
                        }
                        updatedStudents[sIdx] = s;
                    }
                });
                return { updatedStudents, updatedGroups };
            };

            const handleBossAttack = (studentId, type, targetGroupId, damageDealt, damageTaken, healAmt, isDodged, currentBossId) => {
                let updatedStudents = [...students];
                let updatedGroups = [...groups];
                let sIndex = updatedStudents.findIndex(s => s.id === studentId);
                let student = { ...updatedStudents[sIndex] };
                const synergy = getGroupSynergy(student.groupId, updatedStudents);

                if (damageTaken > 0 && !isDodged) {
                    student.hp -= damageTaken;
                    addLog(`🩸 ${student.name} 遭到魔王攻擊，失去 ${damageTaken} 點生命。`, student.classId);
                    
                    if (student.hp <= 0) {
                        const reviveIndex = student.inventory.findIndex(item => item.id === 'i2');
                        if (reviveIndex !== -1) {
                            student.inventory.splice(reviveIndex, 1);
                            student.hp = student.maxHp + synergy.hpBonus;
                            addLog(`✨ ${student.name} 倒下了，但使用了【復活十字章】滿血復活！`, student.classId);
                        } else {
                            student.hp = 0; 
                            const oldLevel = student.level;
                            student.level = Math.max(1, student.level - 5);
                            student.maxHp = 20 + (student.level - 1) * 5; 
                            student.exp = 0; 
                            const levelLoss = oldLevel - student.level;
                            if (levelLoss > 0) addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，並受到死亡懲罰失去了 ${levelLoss} 級修為！`, student.classId);
                            else addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，需等待救援或使用道具。`, student.classId);
                        }
                    }
                } else if (isDodged) {
                    addLog(`💨 ${student.name} 敏捷地閃避了魔王的致命攻擊！`, student.classId);
                }

                if (student.hp > 0 && healAmt > 0) {
                    const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                    student.hp = Math.min(student.hp + healAmt, effectiveMaxHp);
                    addLog(`✨ 觸發神聖治癒！${student.name} 恢復了 ${healAmt} 點生命。`, student.classId);
                }

                updatedStudents[sIndex] = student;

                const aliveClerics = updatedStudents.filter(s => s.groupId === student.groupId && s.job === '牧師' && s.hp > 0);
                if (aliveClerics.length > 0) {
                    let healedOthers = false;
                    let revivedMemberName = null;
                    const deadMembers = updatedStudents.filter(s => s.groupId === student.groupId && s.hp <= 0);
                    let targetReviveId = null;
                    
                    if (deadMembers.length > 0) {
                        const target = deadMembers[Math.floor(Math.random() * deadMembers.length)];
                        targetReviveId = target.id;
                        revivedMemberName = target.name;
                    }

                    updatedStudents = updatedStudents.map(s => {
                        if (s.groupId === student.groupId) {
                            const memberSynergy = getGroupSynergy(s.groupId, updatedStudents);
                            const effMaxHp = s.maxHp + memberSynergy.hpBonus;
                            if (s.id === targetReviveId) {
                                return { ...s, hp: Math.floor(effMaxHp / 2) || 1 }; 
                            } else if (s.hp > 0) {
                                if (s.hp < effMaxHp && s.id !== student.id) healedOthers = true;
                                return { ...s, hp: Math.min(s.hp + 5, effMaxHp) }; 
                            }
                        }
                        return s;
                    });
                    if (revivedMemberName) addLog(`👼 奇蹟降臨！牧師的神聖祈禱將 ${revivedMemberName} 從死亡邊緣拉了回來！`, student.classId);
                    if (healedOthers) addLog(`✨ 聖光普照！牧師的祈禱為小隊成員恢復了 5 點生命。`, student.classId);
                }

                student = updatedStudents.find(s => s.id === student.id);

                if (damageDealt > 0) {
                    addLog(`⚔️ ${student.name} 對魔王造成了 ${damageDealt} 點傷害！`, student.classId);
                    
                    if (type === 'squad') {
                        let bossData = { ...squadBosses[targetGroupId] };
                        if (bossData && bossData.id === currentBossId) {
                            bossData.currentHp -= damageDealt;
                            bossData.contributions = bossData.contributions || {};
                            bossData.contributions[studentId] = (bossData.contributions[studentId] || 0) + damageDealt;
                            
                            if (bossData.currentHp <= 0) {
                                addLog(`🎉 【${getGroup(targetGroupId).name}】成功擊殺了迷宮魔王 ${bossData.name}！`, student.classId);
                                const res = distributeBossRewards(bossData, updatedStudents, updatedGroups);
                                updatedStudents = res.updatedStudents;
                                updatedGroups = res.updatedGroups;
                                setSquadBosses(prev => { const n = {...prev}; delete n[targetGroupId]; return n; });
                            } else {
                                setSquadBosses(prev => ({ ...prev, [targetGroupId]: bossData }));
                            }
                        }
                    } else if (type === 'guild') {
                        let bossData = { ...guildBoss };
                        if (bossData && bossData.id === currentBossId) {
                            bossData.currentHp -= damageDealt;
                            bossData.contributions = bossData.contributions || {};
                            bossData.contributions[studentId] = (bossData.contributions[studentId] || 0) + damageDealt;
                            
                            if (bossData.currentHp <= 0) {
                                addLog(`🏆 全公會齊心協力，成功擊殺了世界首領 ${bossData.name}！`, null);
                                const res = distributeBossRewards(bossData, updatedStudents, updatedGroups);
                                updatedStudents = res.updatedStudents;
                                updatedGroups = res.updatedGroups;
                                setGuildBoss(null);
                            } else {
                                setGuildBoss(bossData);
                            }
                        }
                    }
                }

                setStudents(updatedStudents);
                setGroups(updatedGroups);
            };

            const handleQuestResult = (studentId, monsterIdOrObj, isCorrect, combatData) => {
                const monster = typeof monsterIdOrObj === 'string' ? MONSTERS.find(m => m.id === monsterIdOrObj) : monsterIdOrObj;
                let updatedStudents = [...students];
                let updatedGroups = [...groups];
                let sIndex = updatedStudents.findIndex(s => s.id === studentId);
                let student = { ...updatedStudents[sIndex] };
                let gIndex = updatedGroups.findIndex(g => g.id === student.groupId);
                
                const synergy = getGroupSynergy(student.groupId, updatedStudents);
                const { finalExp, finalGold, finalDmg, healAmt, isDodged } = combatData;

                if (isCorrect) {
                    student.exp += finalExp;
                    student.gold += finalGold;
                    if(gIndex !== -1) updatedGroups[gIndex].score += finalExp; 
                    addLog(`🌟 ${student.name} 擊敗了 ${monster.name}！獲得 ${finalExp} EXP, ${finalGold} 金幣。`, student.classId);
                    if (synergy.active && synergy.expGoldMult > 1) {
                        addLog(`✨ 觸發小隊羈絆【${synergy.name}】！獲得額外收益。`, student.classId);
                    }
                } else {
                    if (isDodged) {
                        addLog(`💨 ${student.name} 敏捷地閃避了 ${monster.name} 的致命攻擊！`, student.classId);
                    } else {
                        student.hp -= finalDmg;
                        addLog(`🩸 ${student.name} 遭到 ${monster.name} 攻擊，失去 ${finalDmg} 點生命。`, student.classId);
                    }

                    if (student.hp <= 0) {
                        const reviveIndex = student.inventory.findIndex(item => item.id === 'i2');
                        if (reviveIndex !== -1) {
                            student.inventory.splice(reviveIndex, 1);
                            student.hp = student.maxHp + synergy.hpBonus;
                            addLog(`✨ ${student.name} 倒下了，但使用了【復活十字章】滿血復活！`, student.classId);
                        } else {
                            student.hp = 0; 
                            const oldLevel = student.level;
                            student.level = Math.max(1, student.level - 5);
                            student.maxHp = 20 + (student.level - 1) * 5; 
                            student.exp = 0; 
                            const levelLoss = oldLevel - student.level;
                            if (levelLoss > 0) addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，並受到死亡懲罰失去了 ${levelLoss} 級修為！`, student.classId);
                            else addLog(`☠️ ${student.name} 陣亡了... 陷入重傷狀態 (HP=0)，需等待救援或使用道具。`, student.classId);
                        }
                    }
                }

                if (student.hp > 0 && healAmt > 0) {
                    const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                    student.hp = Math.min(student.hp + healAmt, effectiveMaxHp);
                    addLog(`✨ 觸發神聖治癒！${student.name} 恢復了 ${healAmt} 點生命。`, student.classId);
                }

                updatedStudents[sIndex] = student;

                const aliveClerics = updatedStudents.filter(s => s.groupId === student.groupId && s.job === '牧師' && s.hp > 0);
                if (aliveClerics.length > 0) {
                    let healedOthers = false;
                    let revivedMemberName = null;
                    const deadMembers = updatedStudents.filter(s => s.groupId === student.groupId && s.hp <= 0);
                    let targetReviveId = null;
                    
                    if (deadMembers.length > 0) {
                        const target = deadMembers[Math.floor(Math.random() * deadMembers.length)];
                        targetReviveId = target.id;
                        revivedMemberName = target.name;
                    }

                    updatedStudents = updatedStudents.map(s => {
                        if (s.groupId === student.groupId) {
                            const memberSynergy = getGroupSynergy(s.groupId, updatedStudents);
                            const effMaxHp = s.maxHp + memberSynergy.hpBonus;
                            if (s.id === targetReviveId) {
                                return { ...s, hp: Math.floor(effMaxHp / 2) || 1 }; 
                            } else if (s.hp > 0) {
                                if (s.hp < effMaxHp && s.id !== student.id) healedOthers = true;
                                return { ...s, hp: Math.min(s.hp + 5, effMaxHp) }; 
                            }
                        }
                        return s;
                    });
                    if (revivedMemberName) addLog(`👼 奇蹟降臨！牧師的神聖祈禱將 ${revivedMemberName} 從死亡邊緣拉了回來！`, student.classId);
                    if (healedOthers) addLog(`✨ 聖光普照！牧師的祈禱為小隊成員恢復了 5 點生命。`, student.classId);
                }

                student = updatedStudents.find(s => s.id === student.id); 

                let reqExp = getExpReq(student.level);
                let leveledUp = false;
                while (student.exp >= reqExp) {
                    student.exp -= reqExp;
                    student.level += 1;
                    student.maxHp += 5;
                    student.hp = student.maxHp + synergy.hpBonus; 
                    leveledUp = true;
                    reqExp = getExpReq(student.level);
                }
                
                if (leveledUp) {
                    addLog(`🆙 ${student.name} 升級到了等級 ${student.level}！(可至商行購買轉職憑證)`, student.classId);
                }

                updatedStudents[sIndex] = student;
                setStudents(updatedStudents);
                setGroups(updatedGroups);
            };

            // ★ 更新：綜合的獎懲執行邏輯 (加扣分與金幣)
            // ★ 修正：一次處理整批學生，避免多選時互相覆蓋更新
            const handleApplyRule = (studentIds, ruleId) => {
                const ids = Array.isArray(studentIds) ? studentIds : [studentIds];
                let updatedStudents = [...students];
                let updatedGroups = [...groups];
                const ruleItem = ruleItems.find(p => p.id === ruleId);
                if(!ruleItem) return;
                const logsToAdd = [];

                ids.forEach(studentId => {
                    let sIndex = updatedStudents.findIndex(s => s.id === parseInt(studentId));
                    if(sIndex === -1) return;

                    let student = { ...updatedStudents[sIndex] };
                    let gIndex = updatedGroups.findIndex(g => g.id === student.groupId);

                    if (ruleItem.type === 'penalty') {
                        const pts = ruleItem.exp || 0;
                        student.exp -= pts;

                        while(student.exp < 0 && student.level > 1) {
                            student.level -= 1;
                            student.maxHp -= 5;
                            student.exp += getExpReq(student.level);
                        }
                        if (student.exp < 0) student.exp = 0; 
                        
                        const synergy = getGroupSynergy(student.groupId, updatedStudents);
                        const effMaxHp = student.maxHp + synergy.hpBonus;
                        if (student.hp > effMaxHp) student.hp = effMaxHp;

                        updatedStudents[sIndex] = student;
                        if(gIndex !== -1) updatedGroups[gIndex] = { ...updatedGroups[gIndex], score: Math.max(0, (updatedGroups[gIndex].score||0) - pts) };

                        logsToAdd.push({ msg: `⚖️ 紀律裁決：${student.name} 因為【${ruleItem.name}】被扣除了 ${pts} EXP！`, classId: student.classId });
                    } else {
                        const expReward = ruleItem.exp || 0;
                        const goldReward = ruleItem.gold || 0;
                        
                        student.exp += expReward;
                        student.gold += goldReward;
                        if(gIndex !== -1) updatedGroups[gIndex] = { ...updatedGroups[gIndex], score: (updatedGroups[gIndex].score||0) + expReward };
                        
                        let reqExp = getExpReq(student.level);
                        let leveledUp = false;
                        while (student.exp >= reqExp) {
                            student.exp -= reqExp;
                            student.level += 1;
                            student.maxHp += 5;
                            const synergy = getGroupSynergy(student.groupId, updatedStudents);
                            student.hp = student.maxHp + synergy.hpBonus; 
                            leveledUp = true;
                            reqExp = getExpReq(student.level);
                        }

                        updatedStudents[sIndex] = student;
                        logsToAdd.push({ msg: `🎁 獎勵頒發：${student.name} 因為【${ruleItem.name}】獲得了 ${expReward} EXP 與 ${goldReward} G！`, classId: student.classId });
                        if(leveledUp) logsToAdd.push({ msg: `🆙 ${student.name} 升級到了等級 ${student.level}！`, classId: student.classId });
                    }
                });

                playAudio(ruleItem.type === 'penalty' ? 'penalty' : 'win');
                setStudents(updatedStudents);
                setGroups(updatedGroups);
                logsToAdd.forEach(l => addLog(l.msg, l.classId));
            };

            // ★ 更新：小隊加扣分機制 (直接對小隊積分加減，不影響隊員個人 EXP/金幣；一次處理整批小隊，避免多選時互相覆蓋)
            const handleApplyTeamRule = (groupIds, ruleId) => {
                const ids = Array.isArray(groupIds) ? groupIds : [groupIds];
                let updatedGroups = [...groups];
                const ruleItem = ruleItems.find(p => p.id === ruleId);
                if(!ruleItem) return;
                const logsToAdd = [];

                ids.forEach(groupId => {
                    let gIndex = updatedGroups.findIndex(g => g.id === parseInt(groupId));
                    if(gIndex === -1) return;
                    const group = { ...updatedGroups[gIndex] };
                    const pts = ruleItem.exp || 0;

                    if (ruleItem.type === 'penalty') {
                        group.score = Math.max(0, (group.score || 0) - pts);
                        logsToAdd.push({ msg: `⚖️ 小隊裁決：【${group.name}】因為【${ruleItem.name}】被扣除了 ${pts} 積分！`, classId: group.classId });
                    } else {
                        group.score = (group.score || 0) + pts;
                        logsToAdd.push({ msg: `🏆 小隊獎勵：【${group.name}】因為【${ruleItem.name}】獲得了 ${pts} 積分！`, classId: group.classId });
                    }
                    updatedGroups[gIndex] = group;
                });

                playAudio(ruleItem.type === 'penalty' ? 'penalty' : 'win');
                setGroups(updatedGroups);
                logsToAdd.forEach(l => addLog(l.msg, l.classId));
            };

            const handleAddRuleItem = (type, name, exp, gold) => {
                const newItem = { id: Date.now(), type, name, exp: parseInt(exp)||0, gold: parseInt(gold)||0 };
                setRuleItems([...ruleItems, newItem]);
            };

            const handleDeleteRuleItem = (id) => {
                setRuleItems(ruleItems.filter(i => i.id !== id));
            };

            const changeJob = (studentId, newJob) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex] = { ...updated[sIndex], job: newJob };
                setStudents(updated);
                setShowJobModal(null);
                addLog(`🎉 ${updated[sIndex].name} 成功轉職為【${newJob}】！`, updated[sIndex].classId);
            };

            const saveAvatar = (studentId, newAvatarObj) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar = newAvatarObj;
                setStudents(updated);
                setEditingAvatarId(null);
                addLog(`✨ ${updated[sIndex].name} 改變了造型外觀！`, updated[sIndex].classId);
            };

            const handleApproveCustomAvatar = (studentId) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar.customImageStatus = 'approved';
                setStudents(updated);
                addLog(`✅ 教師已核准 ${updated[sIndex].name} 的 Reroll 自訂頭像！`, updated[sIndex].classId);
            };

            const handleRejectCustomAvatar = (studentId) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                updated[sIndex].avatar.customImageStatus = 'rejected';
                setStudents(updated);
                addLog(`❌ 教師已駁回 ${updated[sIndex].name} 的頭像申請，請重新上傳。`, updated[sIndex].classId);
            };

            const handleArchiveClass = (classId) => {
                setClasses(prev => prev.map(c => c.id === classId ? { ...c, isArchived: !c.isArchived } : c));
                addLog(`📜 分會封存狀態已更新。`, null);
            };

            const handleDeleteClass = (classId) => {
                const classGroups = groups.filter(g => g.classId === classId);
                const groupIds = classGroups.map(g => g.id);

                setSquadBosses(prev => {
                    const next = { ...prev };
                    groupIds.forEach(id => delete next[id]);
                    return next;
                });

                setStudents(prev => prev.filter(s => s.classId !== classId));
                setGroups(prev => prev.filter(g => g.classId !== classId));
                setLogs(prev => prev.filter(l => l.classId !== classId));
                setClasses(prev => prev.filter(c => c.id !== classId));
                
                addLog(`🗑️ 已永久刪除一個分會及其所有資料。`, null);
            };

            const buyItem = (studentId, item) => {
                let updated = [...students];
                let sIndex = updated.findIndex(s => s.id === studentId);
                let student = { ...updated[sIndex] };
                
                if (student.gold >= item.cost) {
                    if (item.id === 'i_job') {
                        if (student.level < 5) {
                            alert("等級不足 5 級，公會不受理您的轉職申請！請繼續努力。");
                            return;
                        }
                        student.gold -= item.cost;
                        updated[sIndex] = student;
                        setStudents(updated);
                        setShowJobModal(student);
                        addLog(`📜 ${student.name} 花費 ${item.cost} G 購買了皇家轉職憑證，準備轉職！`, student.classId);
                        return; 
                    }

                    student.gold -= item.cost;
                    if (item.type === 'consumable') {
                        const synergy = getGroupSynergy(student.groupId, updatedStudents);
                        const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                        student = item.effect(student, effectiveMaxHp);
                        addLog(`🧪 ${student.name} 使用了 ${item.name}。`, student.classId);
                    } else if (item.type === 'equipment') {
                        student.equipment = item;
                        addLog(`⚔️ ${student.name} 裝備了 ${item.name}。`, student.classId);
                    } else if (item.type === 'frame') {
                        if (!student.avatar.unlockedFrames.includes(item.value)) {
                            student.avatar.unlockedFrames.push(item.value);
                            student.avatar.frameClass = item.value; 
                            addLog(`👑 ${student.name} 購買並裝備了高階外框：${item.name}。`, student.classId);
                        }
                    } else {
                        student.inventory.push(item);
                        addLog(`🛍️ ${student.name} 購買了 ${item.name}。`, student.classId);
                    }
                    updated[sIndex] = student;
                    setStudents(updated);
                } else {
                    alert("金幣不足！");
                }
            };

            const handleAddClass = (name) => {
                const newId = classes.length > 0 ? Math.max(...classes.map(c => c.id)) + 1 : 1;
                setClasses([...classes, { id: newId, name }]);
                addLog(`📜 建立了新的編制班級：${name}`, null);
            };

            const handleAddGroup = (namesStr, classId) => {
                const names = namesStr.split(/[,，\n、]+/).map(n => n.trim()).filter(n => n);
                if (names.length === 0) return;
                setGroups(prev => {
                    let maxId = prev.length > 0 ? Math.max(...prev.map(g => g.id)) : 0;
                    const newGroups = names.map((name, i) => ({ id: maxId + i + 1, classId: parseInt(classId), name, score: 0 }));
                    return [...prev, ...newGroups];
                });
                addLog(`🛡️ 成立了新的冒險小隊：${names.join('、')}`, parseInt(classId));
            };

            const handleDeleteGroup = (groupId) => {
                const group = groups.find(g => g.id === groupId);
                if (!group) return;
                // 該小隊的學生改為「無小隊」，而不會一併被刪除
                setStudents(prev => prev.map(s => s.groupId === groupId ? { ...s, groupId: null } : s));
                setGroups(prev => prev.filter(g => g.id !== groupId));
                setSquadBosses(prev => {
                    const next = { ...prev };
                    delete next[groupId];
                    return next;
                });
                addLog(`🗑️ 解散了小隊：${group.name}（原成員已變為無小隊）`, group.classId);
            };

            const handleDeleteStudent = (studentId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                setStudents(prev => prev.filter(s => s.id !== studentId));
                addLog(`🗑️ 已將冒險者 ${student.name} 從公會除名。`, student.classId);
            };

            const handleAddStudent = (namesStr, classId, groupId) => {
                const names = namesStr.split(/[,，\n、]+/).map(n => n.trim()).filter(n => n);
                if (names.length === 0) return;
                
                setStudents(prev => {
                    let maxId = prev.length > 0 ? Math.max(...prev.map(s => s.id)) : 0;
                    const classSize = prev.filter(s => s.classId === parseInt(classId)).length;

                    const newStudents = names.map((name, i) => ({
                        id: maxId + i + 1, classId: parseInt(classId), groupId: parseInt(groupId), 
                        name, pin: '0000', level: 1, exp: 0, gold: 0, hp: 20, maxHp: 20, job: '新手', 
                        inventory: [], equipment: null, avatar: defaultAvatar(name, classSize + i + 1) 
                    }));
                    return [...prev, ...newStudents];
                });
                addLog(`⚔️ 招募了新的冒險者：${names.join('、')}`, parseInt(classId));
            };

            const handleMoveStudent = (studentId, newGroupId) => {
                const student = students.find(s => s.id === studentId);
                if (!student) return;
                const targetGroupId = newGroupId ? parseInt(newGroupId) : null;
                if (student.groupId === targetGroupId) return;
                const oldGroupName = getGroup(student.groupId)?.name || '無小隊';
                const newGroupName = targetGroupId ? (getGroup(targetGroupId)?.name || '未知小隊') : '無小隊';
                setStudents(prev => prev.map(s => s.id === studentId ? { ...s, groupId: targetGroupId } : s));
                addLog(`🔀 將冒險者 ${student.name} 從【${oldGroupName}】調動至【${newGroupName}】`, student.classId);
            };

            const handleLogout = () => {
                setCurrentClassId(null);
                setShopBuyerId(null);
                setLoginMode(null);
                setLoggedInStudentId(null);
                setView('dashboard');
            };

            const getGroup = (id) => groups.find(g => g.id === id);
            const getClassObj = (id) => classes.find(c => c.id === id);

            if (!isCloudLoaded) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4 relative z-10 animate-fade-in bg-guild-dark">
                        <i className="fa-solid fa-dragon text-6xl text-guild-gold mb-6 animate-pulse"></i>
                        <h2 className="text-2xl text-guild-gold mb-2 font-bold tracking-widest">自然科學冒險者公會</h2>
                        <p className="text-guild-paper/70 flex items-center gap-2">
                            <i className="fa-solid fa-cloud-arrow-down animate-bounce text-blue-400"></i>
                            連結公會水晶網路中...
                        </p>
                    </div>
                );
            }

            if (view === 'student_login') {
                const doLogin = () => {
                    const student = students.find(s => s.id === parseInt(selStudent));
                    if (student && student.pin === inputPin) {
                        setCurrentClassId(student.classId);
                        setLoggedInStudentId(student.id);
                        setLoginMode('student');
                        setView('student_dashboard');
                    } else {
                        alert('密碼錯誤或未選擇冒險者！');
                    }
                };

                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative z-10 animate-fade-in flex-col">
                        <div className="panel p-8 md:p-12 max-w-lg w-full text-center shadow-[0_0_50px_rgba(96,165,250,0.15)] border border-blue-500/30">
                            <i className="fa-solid fa-user-shield text-5xl text-blue-400 mb-4"></i>
                            <h2 className="text-3xl font-bold text-blue-400 mb-2 tracking-widest">冒險者登入</h2>
                            <p className="text-gray-400 mb-8 text-sm">請驗證您的公會身分以查看個人面板</p>
                            
                            <div className="space-y-4 text-left">
                                <div>
                                    <label className="block text-sm text-guild-paper mb-1">所屬分會</label>
                                    <select value={selClass} onChange={e => {setSelClass(e.target.value); setSelStudent('');}} className="w-full p-3 bg-guild-dark border border-gray-600 rounded text-guild-paper focus:outline-none focus:border-blue-400">
                                        <option value="">-- 選擇班級 --</option>
                                        {classes.filter(c => !c.isArchived).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-guild-paper mb-1">冒險者姓名</label>
                                    <select value={selStudent} onChange={e => setSelStudent(e.target.value)} disabled={!selClass} className="w-full p-3 bg-guild-dark border border-gray-600 rounded text-guild-paper focus:outline-none focus:border-blue-400">
                                        <option value="">-- 選擇姓名 --</option>
                                        {students.filter(s => s.classId === parseInt(selClass)).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-guild-paper mb-1">身分密碼 (預設:0000)</label>
                                    <input type="password" placeholder="請輸入 4 位數密碼" value={inputPin} onChange={e => setInputPin(e.target.value)} maxLength="4" className="w-full p-3 bg-guild-dark border border-gray-600 rounded text-guild-paper focus:outline-none focus:border-blue-400 tracking-widest text-center text-xl" />
                                </div>
                                <button onClick={doLogin} className="w-full py-4 mt-6 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded shadow-lg transition text-lg">登入系統</button>
                                <button onClick={() => setView('dashboard')} className="w-full py-2 mt-2 text-gray-500 hover:text-white transition text-sm">取消返回</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (currentClassId === null) {
                const worldLogs = logs.filter(l => l.classId === null);

                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative z-10 animate-fade-in flex-col">
                        {cloudError && (
                            <div className="bg-red-900/80 border-l-4 border-red-500 text-white p-4 rounded mb-6 w-full max-w-4xl text-left shadow-lg animate-pulse z-50">
                                <div className="font-bold flex items-center"><i className="fa-solid fa-triangle-exclamation mr-2 text-xl"></i> 雲端同步系統發生錯誤</div>
                                <div className="mt-1 text-red-200">{cloudError}</div>
                            </div>
                        )}

                        <div className="flex w-full max-w-4xl justify-end mb-4">
                            <button onClick={() => setView('student_login')} className="px-6 py-2 bg-blue-900/80 hover:bg-blue-800 border border-blue-500/50 text-blue-200 font-bold rounded-full shadow-lg transition flex items-center">
                                <i className="fa-solid fa-user-shield mr-2"></i> 冒險者(學生)登入
                            </button>
                        </div>

                        <div className="panel p-8 md:p-12 max-w-4xl w-full text-center shadow-[0_0_50px_rgba(197,159,68,0.15)] mb-8">
                            <i className="fa-solid fa-dragon text-6xl text-guild-gold mb-4"></i>
                            <h1 className="text-4xl font-bold text-guild-gold mb-2 tracking-widest">自然科學冒險者公會</h1>
                            <p className="text-guild-paper/70 mb-10 text-lg">世界地圖 - 請選擇您要進入的分會大廳 (教師專用)</p>
                            
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-10">
                                {classes.filter(c => !c.isArchived).map(c => (
                                    <button key={c.id} onClick={() => { setCurrentClassId(c.id); setLoginMode('teacher'); }} className="panel p-8 border border-guild-gold/30 hover:border-guild-gold hover:bg-guild-gold/10 transition group transform hover:-translate-y-1">
                                        <i className="fa-solid fa-dungeon text-4xl text-gray-500 group-hover:text-guild-gold mb-4 transition duration-300"></i>
                                        <h3 className="text-2xl font-bold text-guild-paper group-hover:text-white transition">{c.name}</h3>
                                        <p className="text-xs text-gray-500 mt-2">進入分會</p>
                                    </button>
                                ))}
                            </div>
                            <div className="border-t border-guild-gold/30 pt-8 pb-4 max-w-md mx-auto">
                                <h4 className="text-guild-gold mb-3 font-bold"><i className="fa-solid fa-hammer mr-2"></i>拓荒建立新分會</h4>
                                <div className="flex gap-2">
                                    <input type="text" id="newClassInput" placeholder="輸入新班級名稱 (如: 703班)" className="flex-1 p-3 bg-guild-dark border border-guild-gold/50 rounded text-guild-paper focus:outline-none focus:border-guild-gold transition" />
                                    <button onClick={() => { const v = document.getElementById('newClassInput').value; if(v){ handleAddClass(v); document.getElementById('newClassInput').value=''; } }} className="px-6 py-3 bg-guild-gold text-guild-dark font-bold rounded hover:bg-yellow-500 transition shadow-lg">建立</button>
                                </div>
                            </div>
                            <div className="mt-8 pt-4">
                                <button onClick={() => { setCurrentClassId('admin'); setLoginMode('teacher'); setView('admin'); }} className="text-gray-500 hover:text-guild-gold transition text-sm flex items-center justify-center w-full">
                                    <i className="fa-solid fa-gear mr-2"></i> 進入教師辦公室 (管理後台)
                                </button>
                            </div>
                        </div>

                        <div className="panel p-6 max-w-4xl w-full text-left bg-black/60 border border-gray-700 shadow-xl">
                            <h3 className="text-xl text-guild-gold mb-4 font-bold tracking-widest"><i className="fa-solid fa-globe mr-2"></i>世界紀錄簿 (全系統公告)</h3>
                            <div className="text-sm space-y-2 h-40 overflow-y-auto pr-2 opacity-80 font-mono custom-scrollbar">
                                {worldLogs.map((log, i) => (
                                    <div key={i} className="border-b border-gray-700/50 pb-2 mb-2 last:border-0"><span className="text-gray-500 mr-2">[{log.time}]</span> <span className="text-gray-300">{log.msg}</span></div>
                                ))}
                                {worldLogs.length === 0 && <div className="text-gray-500 text-center py-8">這個世界目前非常平靜，尚未有任何重大事件發生。</div>}
                            </div>
                        </div>
                    </div>
                );
            }

            if (loginMode === 'student' && view === 'student_dashboard') {
                const student = students.find(s => s.id === loggedInStudentId);
                if (!student) return <div>載入錯誤</div>;
                const synergy = getGroupSynergy(student.groupId, students);
                const effectiveMaxHp = student.maxHp + synergy.hpBonus;
                const hpPercent = Math.min((student.hp / effectiveMaxHp) * 100, 100);
                const expPercent = (student.exp / (student.level * 100)) * 100;
                const groupName = getGroup(student.groupId)?.name || '無小隊';

                const handlePinChange = () => {
                    if(newPinStr.length !== 4) return alert('密碼必須是 4 碼！');
                    let updated = [...students];
                    let sIndex = updated.findIndex(s => s.id === student.id);
                    updated[sIndex].pin = newPinStr;
                    setStudents(updated);
                    setIsChangingPin(false);
                    alert('密碼修改成功！');
                };

                return (
                    <div className="flex flex-col min-h-screen animate-fade-in relative z-10">
                        <nav className="w-full panel rounded-none border-b border-blue-500/30 bg-blue-950/20 p-4 flex items-center justify-between z-20 sticky top-0 shadow-lg">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-shield-halved text-2xl text-blue-400"></i>
                                <div>
                                    <h1 className="text-lg font-bold text-blue-300 tracking-widest leading-none">冒險者個人終端</h1>
                                    <p className="text-xs text-gray-400 mt-1">[{getClassObj(student.classId)?.name}] 專屬連線</p>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="px-4 py-2 bg-guild-dark border border-gray-600 hover:bg-red-900/50 hover:text-white text-gray-400 font-bold rounded transition text-sm flex items-center">
                                <i className="fa-solid fa-right-from-bracket mr-2"></i> 登出
                            </button>
                        </nav>
                        
                        <main className="flex-1 p-4 md:p-8 overflow-y-auto max-w-4xl mx-auto w-full">
                            <div className="panel p-8 flex flex-col md:flex-row gap-8 items-center md:items-start border border-blue-500/20 shadow-[0_0_30px_rgba(59,130,246,0.1)]">
                                <div className="flex flex-col items-center shrink-0">
                                    <AvatarDisplay student={student} size="w-48 h-48" />
                                    <div className="mt-6 w-full flex flex-col gap-2">
                                        <button onClick={() => setEditingAvatarId(student.id)} className="w-full py-2 bg-indigo-800 hover:bg-indigo-700 text-white font-bold rounded shadow transition text-sm"><i className="fa-solid fa-scissors mr-2"></i>進入換裝室</button>
                                        <button onClick={() => setShopBuyerId(student.id)} className="w-full py-2 bg-yellow-700 hover:bg-yellow-600 text-white font-bold rounded shadow transition text-sm"><i className="fa-solid fa-store mr-2"></i>開啟隨身商行</button>
                                    </div>
                                </div>
                                <div className="flex-1 w-full space-y-6">
                                    <div>
                                        <div className="text-blue-400 text-sm mb-1">{groupName}</div>
                                        <h2 className="text-4xl font-bold text-white mb-2">{student.name} <span className="text-xl text-gray-400 font-normal ml-2">Lv.{student.level} {student.job}</span></h2>
                                        <div className="text-guild-gold font-bold text-lg"><i className="fa-solid fa-coins mr-1"></i> {student.gold} G &nbsp; | &nbsp; <span className="text-gray-400 font-normal text-sm">公會總分: {(student.level-1)*1000 + student.exp}</span></div>
                                    </div>

                                    <div className="space-y-4 bg-guild-dark p-6 rounded-lg border border-gray-700">
                                        <div>
                                            <div className="flex justify-between text-sm mb-1"><span className="text-red-400 font-bold"><i className="fa-solid fa-heart mr-2"></i>生命值</span><span>{student.hp} / {effectiveMaxHp}</span></div>
                                            <div className="hp-bar-container h-3"><div className="hp-bar-fill" style={{width: `${hpPercent}%`}}></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-sm mb-1"><span className="text-blue-400 font-bold"><i className="fa-solid fa-star mr-2"></i>目前經驗值</span><span>{student.exp} / {student.level * 100}</span></div>
                                            <div className="exp-bar-container h-2"><div className="exp-bar-fill" style={{width: `${expPercent}%`}}></div></div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-guild-dark p-4 rounded border border-gray-700">
                                            <h4 className="text-gray-400 text-sm mb-2">當前裝備</h4>
                                            <div className="text-blue-300 font-bold">{student.equipment ? <><i className="fa-solid fa-khanda mr-2"></i>{student.equipment.name}</> : '尚無裝備'}</div>
                                        </div>
                                        <div className="bg-guild-dark p-4 rounded border border-gray-700">
                                            <h4 className="text-gray-400 text-sm mb-2">背包道具</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {student.inventory.length === 0 ? <span className="text-gray-500">背包空空如也</span> : student.inventory.map((i, idx) => (
                                                    <span key={idx} className="bg-gray-800 text-gray-300 px-2 py-1 rounded text-xs"><i className="fa-solid fa-box mr-1"></i>{i.name}</span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="border-t border-gray-700 pt-4 mt-4 text-right">
                                        {isChangingPin ? (
                                            <div className="flex justify-end gap-2">
                                                <input type="text" placeholder="新 4 碼" value={newPinStr} onChange={e=>setNewPinStr(e.target.value)} maxLength="4" className="w-24 p-1 bg-black border border-gray-500 rounded text-white text-center" />
                                                <button onClick={handlePinChange} className="px-3 py-1 bg-green-700 text-white rounded text-sm">儲存</button>
                                                <button onClick={()=>setIsChangingPin(false)} className="px-3 py-1 bg-gray-700 text-white rounded text-sm">取消</button>
                                            </div>
                                        ) : (
                                            <button onClick={()=>setIsChangingPin(true)} className="text-gray-500 hover:text-white text-sm transition"><i className="fa-solid fa-key mr-1"></i> 修改登入密碼</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </main>
                        
                        {/* 學生視角的彈窗共用原本的元件 */}
                        {shopBuyerId && <Shop buyer={students.find(s => s.id === shopBuyerId)} onBuy={buyItem} onClose={() => setShopBuyerId(null)} students={students} />}
                        {editingAvatarId && <AvatarEditor student={students.find(s => s.id === editingAvatarId)} onSave={saveAvatar} onClose={() => setEditingAvatarId(null)} />}
                    </div>
                )
            }

            return (
                <div className="flex flex-col min-h-screen animate-fade-in">
                    <nav className="w-full panel rounded-none border-b border-guild-gold/30 p-4 flex flex-col md:flex-row items-center justify-between gap-4 z-20 sticky top-0 shadow-lg">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-dragon text-3xl text-guild-gold"></i>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold text-guild-gold tracking-widest leading-none">冒險者公會</h1>
                                    <p className="text-xs text-guild-paper/70 mt-1">[{currentClassId === 'admin' ? '全公會管理中心' : getClassObj(currentClassId)?.name}] 分會大廳</p>
                                </div>
                            </div>
                            <div className="hidden md:flex gap-2">
                                {currentClassId !== 'admin' && (
                                    <>
                                        <button onClick={() => setView('dashboard')} className={`px-4 py-2 rounded transition ${view==='dashboard'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-chess-board mr-2"></i> 公會大廳</button>
                                        <button onClick={() => setView('roster')} className={`px-4 py-2 rounded transition ${view==='roster'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-users mr-2"></i> 冒險者名冊</button>
                                        <button onClick={() => setView('quest')} className={`px-4 py-2 rounded transition ${view==='quest'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}><i className="fa-solid fa-scroll mr-2"></i> 任務看板</button>
                                    </>
                                )}
                                {currentClassId === 'admin' && (
                                    <button className="px-4 py-2 rounded transition bg-guild-gold text-guild-dark font-bold"><i className="fa-solid fa-gavel mr-2"></i> 頭像審核中心</button>
                                )}
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            {cloudError && (
                                <div className="text-red-400 text-xs flex items-center font-bold" title={cloudError}>
                                    <i className="fa-solid fa-cloud-xmark mr-1 animate-pulse"></i> 離線(未存檔)
                                </div>
                            )}
                            <button onClick={handleLogout} className="px-4 py-2 bg-guild-dark border border-gray-600 hover:bg-red-900/50 hover:border-red-500 hover:text-white text-gray-400 font-bold rounded transition text-sm flex items-center">
                                <i className="fa-solid fa-right-from-bracket mr-2"></i> 返回世界地圖
                            </button>
                        </div>
                    </nav>

                    {currentClassId !== 'admin' && (
                        <div className="md:hidden flex flex-wrap justify-center gap-2 bg-guild-dark p-2 border-b border-guild-gold/10">
                            <button onClick={() => setView('dashboard')} className={`px-3 py-1 rounded text-sm transition ${view==='dashboard'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>大廳</button>
                            <button onClick={() => setView('roster')} className={`px-3 py-1 rounded text-sm transition ${view==='roster'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>名冊</button>
                            <button onClick={() => setView('quest')} className={`px-3 py-1 rounded text-sm transition ${view==='quest'?'bg-guild-gold text-guild-dark font-bold':'text-guild-paper hover:bg-guild-gold/20'}`}>任務</button>
                        </div>
                    )}

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {view === 'admin' && <AdminPanel students={students} classes={classes} groups={groups} onApprove={handleApproveCustomAvatar} onReject={handleRejectCustomAvatar} onArchiveClass={handleArchiveClass} onDeleteClass={handleDeleteClass} onAddGroup={handleAddGroup} onDeleteGroup={handleDeleteGroup} onDeleteStudent={handleDeleteStudent} onMoveStudent={handleMoveStudent} />}
                        {view === 'dashboard' && <Dashboard classId={currentClassId} groups={groups} students={students} logs={logs} />}
                        {view === 'roster' && <Roster classId={currentClassId} branchName={currentClassId === 'admin' ? '全公會管理中心' : getClassObj(currentClassId)?.name} groups={groups} students={students} getGroup={getGroup} onOpenShop={setShopBuyerId} onOpenAvatarEditor={setEditingAvatarId} onAddGroup={handleAddGroup} onAddStudent={handleAddStudent} ruleItems={ruleItems} onAddRuleItem={handleAddRuleItem} onDeleteRuleItem={handleDeleteRuleItem} onApplyRule={handleApplyRule} onApplyTeamRule={handleApplyTeamRule} />}
                        {view === 'quest' && <QuestBoard classId={currentClassId} students={students} groups={groups} squadBosses={squadBosses} guildBoss={guildBoss} onResult={handleQuestResult} onSpawnBoss={handleSpawnBoss} onBossAttack={handleBossAttack} />}
                    </main>

                    {/* Modal Layer */}
                    {shopBuyerId && <Shop buyer={students.find(s => s.id === shopBuyerId)} onBuy={buyItem} onClose={() => setShopBuyerId(null)} students={students} />}
                    {editingAvatarId && <AvatarEditor student={students.find(s => s.id === editingAvatarId)} onSave={saveAvatar} onClose={() => setEditingAvatarId(null)} />}
                    
                    {/* ★ 轉職視窗 (買卡後觸發) */}
                    {showJobModal && (
                        <div className="fixed inset-0 bg-black/80 flex p-4 z-50 overflow-y-auto">
                            <div className="panel p-6 max-w-5xl w-full text-center border-guild-gold shadow-[0_0_40px_rgba(197,159,68,0.4)] m-auto">
                                <h2 className="text-3xl font-bold text-guild-gold mb-2">🎉 {showJobModal.name} 準備轉職！</h2>
                                <p className="mb-6 text-gray-300">歷經無數考驗與沉澱，請選擇你未來的專屬戰鬥之道。</p>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                    {['戰士', '法師', '遊俠', '刺客', '牧師'].map(job => (
                                        <button key={job} onClick={() => changeJob(showJobModal.id, job)} className="panel p-4 bg-guild-dark/50 hover:bg-guild-dark hover:border-guild-gold transition flex flex-col items-center gap-3 group">
                                            <i className={`fa-solid ${JOBS[job].icon} text-5xl ${JOBS[job].color} drop-shadow-[0_0_10px_currentColor] group-hover:scale-110 transition-transform duration-300`}></i>
                                            <span className="font-bold text-xl text-guild-paper">{job}</span>
                                            <span className="text-xs text-gray-400 h-10 flex items-center justify-center">{JOBS[job].bonus}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
